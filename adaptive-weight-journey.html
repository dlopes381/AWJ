    renderExerciseRows('eact-exercise', editActivityDraftExercise, 'edit');
    bindExerciseHandlers('edit');
    document.querySelectorAll('#eact-ex-quick-add .chip').forEach(chip=>{
      chip.onclick = ()=> quickAddExercise('edit', chip.dataset.type);
    });
    document.getElementById('eact-save').onclick = ()=> saveEditActivity(editingActivityDate);
    document.getElementById('eact-cancel').onclick = ()=> { editingActivityDate = null; renderLog(); };
  }

  bindDisclosureAnimations(el);
}

// Adds a new calorie line-item pre-filled with the tapped category, so common
// entries (Breakfast/Lunch/Dinner) don't require opening the category dropdown.
// Reuses the form's still-blank default row instead of stacking an empty one.
function quickAddMeal(mode, label){
  const arr = mode==='new' ? activityDraftMeals : editActivityDraftMeals;
  const isBlankDefault = arr.length===1 && !arr[0].calories;
  const row = { id: isBlankDefault ? arr[0].id : cryptoId(), label, calories:'' };
  if(isBlankDefault){ arr[0] = row; } else { arr.push(row); }
  const containerId = mode==='new' ? 'act-meals' : 'eact-meals';
  renderMealRows(containerId, arr, mode);
  bindMealHandlers(mode);
  const input = document.querySelector(`#${containerId} input.meal-cal[data-meal-id="${row.id}"]`);
  if(input) input.focus();
}

// Renders the calorie line-items (meals) for either the new-entry form or the
// inline edit form. Row add/remove re-renders this block; typing in a row just
// updates the in-memory draft + running total (see bindMealHandlers) so focus
// isn't lost on every keystroke.
function renderMealRows(containerId, meals, mode){
  const el = document.getElementById(containerId);
  if(!el) return;
  const rows = meals.map(m=>`
    <div class="row2" style="margin-bottom:${m.foodName?'2px':'8px'}; align-items:center;">
      <select class="meal-label" data-meal-id="${m.id}">
        ${MEAL_CATEGORIES.map(c=>`<option value="${c}" ${m.label===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <div style="display:flex; gap:6px; align-items:center;">
        <input type="number" class="meal-cal" data-meal-id="${m.id}" placeholder="Calories" inputmode="decimal" value="${m.calories===''||m.calories==null?'':m.calories}" style="flex:1;">
        ${meals.length>1 ? `<button type="button" class="del-btn meal-remove" data-meal-id="${m.id}" aria-label="Remove entry">✕</button>` : ''}
      </div>
    </div>
    ${m.foodName ? `<div class="helper" style="margin-bottom:8px;">from: ${escapeHtml(m.foodName)}</div>` : ''}
  `).join('');
  el.innerHTML = rows + `<div class="helper" id="${containerId}-total" style="margin-top:2px;">Total: ${mealsTotal(meals)} cal</div>`;
}

function bindMealHandlers(mode){
  const containerId = mode==='new' ? 'act-meals' : 'eact-meals';
  const container = document.getElementById(containerId);
  if(!container) return;
  const arr = mode==='new' ? activityDraftMeals : editActivityDraftMeals;

  container.querySelectorAll('.meal-label').forEach(sel=>{
    sel.onchange = ()=>{
      const m = arr.find(x=>x.id===sel.dataset.mealId);
      if(!m) return;
      m.label = sel.value;
    };
  });
  container.querySelectorAll('.meal-cal').forEach(inp=>{
    inp.oninput = ()=>{
      const m = arr.find(x=>x.id===inp.dataset.mealId);
      if(!m) return;
      m.calories = inp.value;
      const totalEl = document.getElementById(`${containerId}-total`);
      if(totalEl) totalEl.textContent = `Total: ${mealsTotal(arr)} cal`;
    };
  });
  container.querySelectorAll('.meal-remove').forEach(btn=>{
    btn.onclick = ()=>{
      let newArr = arr.filter(m=>m.id!==btn.dataset.mealId);
      if(newArr.length===0) newArr.push(emptyMealRow());
      if(mode==='new') activityDraftMeals = newArr; else editActivityDraftMeals = newArr;
      renderMealRows(containerId, newArr, mode);
      bindMealHandlers(mode);
    };
  });
}

// ---------------- exercise logging ----------------
// Mirrors the meals draft-array pattern above (activityDraftMeals/editActivityDraftMeals):
// an in-memory array per form, re-rendered only on add/remove so typing doesn't lose
// focus. Unlike meals, there's no default blank row — most days have none logged.
function emptyExerciseRow(type){ return {id:cryptoId(), type: type||'Walk', durationMin:'', caloriesBurned:''}; }
function exerciseCaloriesTotal(rows){ return (rows||[]).reduce((s,r)=> s + (parseFloat(r.caloriesBurned)||0), 0); }

function quickAddExercise(mode, type){
  const arr = mode==='new' ? activityDraftExercise : editActivityDraftExercise;
  const row = emptyExerciseRow(type);
  arr.push(row);
  const containerId = mode==='new' ? 'act-exercise' : 'eact-exercise';
  renderExerciseRows(containerId, arr, mode);
  bindExerciseHandlers(mode);
  const input = document.querySelector(`#${containerId} input.ex-duration[data-ex-id="${row.id}"]`);
  if(input) input.focus();
}

function renderExerciseRows(containerId, rows, mode){
  const el = document.getElementById(containerId);
  if(!el) return;
  if(!rows.length){
    el.innerHTML = `<div class="helper">No exercise logged for this day — tap a type above to add one.</div>`;
    return;
  }
  el.innerHTML = rows.map(r=>`
    <div style="margin-bottom:10px;">
      <select class="ex-type" data-ex-id="${r.id}" style="margin-bottom:6px;">
        ${EXERCISE_TYPES.map(t=>`<option value="${t}" ${r.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <div style="display:flex; gap:6px; align-items:center;">
        <input type="number" class="ex-duration" data-ex-id="${r.id}" placeholder="Minutes" inputmode="decimal" value="${r.durationMin===''||r.durationMin==null?'':r.durationMin}" style="flex:1;">
        <input type="number" class="ex-cal" data-ex-id="${r.id}" placeholder="Cal burned (optional)" inputmode="decimal" value="${r.caloriesBurned===''||r.caloriesBurned==null?'':r.caloriesBurned}" style="flex:1;">
        <button type="button" class="del-btn ex-remove" data-ex-id="${r.id}" aria-label="Remove entry">✕</button>
      </div>
    </div>
  `).join('') + `<div class="helper">Estimated calories burned are used as supporting context only — never treated as exact.</div>`;
}

function bindExerciseHandlers(mode){
  const containerId = mode==='new' ? 'act-exercise' : 'eact-exercise';
  const container = document.getElementById(containerId);
  if(!container) return;
  const arr = mode==='new' ? activityDraftExercise : editActivityDraftExercise;

  container.querySelectorAll('.ex-type').forEach(sel=>{
    sel.onchange = ()=>{ const r = arr.find(x=>x.id===sel.dataset.exId); if(r) r.type = sel.value; };
  });
  container.querySelectorAll('.ex-duration').forEach(inp=>{
    inp.oninput = ()=>{ const r = arr.find(x=>x.id===inp.dataset.exId); if(r) r.durationMin = inp.value; };
  });
  container.querySelectorAll('.ex-cal').forEach(inp=>{
    inp.oninput = ()=>{ const r = arr.find(x=>x.id===inp.dataset.exId); if(r) r.caloriesBurned = inp.value; };
  });
  container.querySelectorAll('.ex-remove').forEach(btn=>{
    btn.onclick = ()=>{
      const newArr = arr.filter(r=>r.id!==btn.dataset.exId);
      if(mode==='new') activityDraftExercise = newArr; else editActivityDraftExercise = newArr;
      renderExerciseRows(containerId, newArr, mode);
      bindExerciseHandlers(mode);
    };
  });
}

// ---------------- bulk historical entry ----------------
// A separate multi-day screen for back-filling a logging gap faster than one day at a
// time via the single-day form above. Each row is independent (date, optional weight,
// optional calories); blank fields are left blank — never guessed — and nothing is
// written to state until "Save all" passes validation. Intentionally does NOT run the
// single-entry findWeightOutlier() guard per row: that guard exists to catch likely
// TYPOS against the most recent entry, but back-filling real history is expected to
// span larger, legitimate jumps between distant dates, and popping a confirm() per row
// would make a bulk save unusable.
let bulkEntryRows = [];

function emptyBulkRow(date){ return { id:cryptoId(), date: date||'', weight:'', calories:'' }; }

function openBulkEntry(){
  bulkEntryRows = [emptyBulkRow(), emptyBulkRow(), emptyBulkRow()];
  document.getElementById('bulk-overlay').classList.remove('hidden');
  renderBulkEntryOverlay();
}
function closeBulkEntry(){
  document.getElementById('bulk-overlay').classList.add('hidden');
}

function bulkRowMarkup(r){
  return `
    <div data-bulk-row="${r.id}" style="padding:12px 0; border-top:1px solid var(--line);">
      <div class="row2" style="align-items:flex-end;">
        <div class="field" style="margin-bottom:0;">
          <label>Date</label>
          <input type="date" class="bulk-date" data-id="${r.id}" value="${escapeHtml(r.date)}">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Weight (${weightUnitLabel()})</label>
          <input type="number" class="bulk-weight" data-id="${r.id}" placeholder="optional" inputmode="decimal" value="${escapeHtml(r.weight)}">
        </div>
      </div>
      <div style="display:flex; gap:8px; align-items:flex-end; margin-top:8px;">
        <div class="field" style="margin-bottom:0; flex:1;">
          <label>Calories</label>
          <input type="number" class="bulk-calories" data-id="${r.id}" placeholder="optional" inputmode="decimal" value="${escapeHtml(r.calories)}">
        </div>
        <button type="button" class="del-btn bulk-remove" data-id="${r.id}" aria-label="Remove row">✕</button>
      </div>
    </div>
  `;
}

function renderBulkEntryOverlay(){
  const body = document.getElementById('bulk-overlay-body');
  body.innerHTML = `
    <p class="page-sub">Log weight and/or calories for several past days at once. Leave a field blank if you don't know it — nothing is guessed, and you can review everything before saving.</p>
    <div class="card" id="bulk-rows" style="padding-top:4px;">
      ${bulkEntryRows.map(r=> bulkRowMarkup(r)).join('')}
    </div>
    <button type="button" class="btn btn-ghost" id="bulk-add-row" style="margin-top:10px;">+ Add another day</button>
    <div id="bulk-error" class="helper" style="color:var(--danger); display:none; margin-top:10px;"></div>
    <button class="btn btn-primary" id="bulk-save" style="margin-top:14px;">Save all</button>
  `;
  bindBulkEntryHandlers();
}

function bindBulkEntryHandlers(){
  document.querySelectorAll('.bulk-date').forEach(inp=>{
    inp.oninput = ()=>{ const r = bulkEntryRows.find(x=>x.id===inp.dataset.id); if(r) r.date = inp.value; };
  });
  document.querySelectorAll('.bulk-weight').forEach(inp=>{
    inp.oninput = ()=>{ const r = bulkEntryRows.find(x=>x.id===inp.dataset.id); if(r) r.weight = inp.value; };
  });
  document.querySelectorAll('.bulk-calories').forEach(inp=>{
    inp.oninput = ()=>{ const r = bulkEntryRows.find(x=>x.id===inp.dataset.id); if(r) r.calories = inp.value; };
  });
  document.querySelectorAll('.bulk-remove').forEach(btn=>{
    btn.onclick = ()=>{
      bulkEntryRows = bulkEntryRows.filter(r=>r.id!==btn.dataset.id);
      if(bulkEntryRows.length===0) bulkEntryRows = [emptyBulkRow()];
      renderBulkEntryOverlay();
    };
  });
  document.getElementById('bulk-add-row').onclick = ()=>{
    bulkEntryRows.push(emptyBulkRow());
    renderBulkEntryOverlay();
  };
  document.getElementById('bulk-save').onclick = saveBulkEntry;
}

function bulkEntryError(msg){
  const errEl = document.getElementById('bulk-error');
  errEl.textContent = msg;
  errEl.style.display = 'block';
}

async function saveBulkEntry(){
  document.getElementById('bulk-error').style.display = 'none';

  // Rows with no date and no values are just unused blank rows — ignore them rather
  // than forcing the user to delete empty rows before saving.
  const candidates = bulkEntryRows.filter(r=> r.date || r.weight!=='' || r.calories!=='');
  if(candidates.length===0){ bulkEntryError('Add at least one day before saving.'); return; }

  const missingDate = candidates.find(r=> !r.date);
  if(missingDate){ bulkEntryError('Every row with a weight or calorie value needs a date.'); return; }

  // Duplicate dates WITHIN this batch — distinct from the overwrite-existing-data
  // check below, which is about dates that were already saved in a previous session.
  const seen = new Set();
  for(const r of candidates){
    if(seen.has(r.date)){ bulkEntryError(`You entered ${prettyDate(r.date)} more than once — combine it into a single row before saving.`); return; }
    seen.add(r.date);
  }

  for(const r of candidates){
    if(r.weight!=='' && !(weightInputToLbs(parseFloat(r.weight))>0)){ bulkEntryError(`${prettyDate(r.date)}: enter a valid weight, or leave it blank.`); return; }
    if(r.calories!=='' && !(parseFloat(r.calories)>=0)){ bulkEntryError(`${prettyDate(r.date)}: enter a valid calorie amount, or leave it blank.`); return; }
  }

  const rowsWithWeight = candidates.filter(r=> r.weight!=='');
  const rowsWithCalories = candidates.filter(r=> r.calories!=='');
  if(rowsWithWeight.length===0 && rowsWithCalories.length===0){ bulkEntryError('Each row needs a weight, a calorie amount, or both.'); return; }

  // Overwrite-confirmation: one combined prompt listing every date that already has
  // saved data, rather than silently clobbering it or popping a confirm per row.
  const conflictDates = new Set();
  rowsWithWeight.forEach(r=>{ if(state.weightLogs.some(l=>l.date===r.date)) conflictDates.add(r.date); });
  rowsWithCalories.forEach(r=>{ if(state.nutritionLogs.some(n=>n.date===r.date)) conflictDates.add(r.date); });
  if(conflictDates.size){
    const list = [...conflictDates].sort().map(d=>prettyDate(d)).join(', ');
    if(!confirm(`This will overwrite existing entries for: ${list}. Continue?`)) return;
  }

  rowsWithWeight.forEach(r=>{
    state.weightLogs = state.weightLogs.filter(l=>l.date!==r.date);
    state.weightLogs.push({id:cryptoId(), date:r.date, weight: weightInputToLbs(parseFloat(r.weight)), notes:''});
  });
  rowsWithCalories.forEach(r=>{
    const existing = state.nutritionLogs.find(n=>n.date===r.date);
    state.nutritionLogs = state.nutritionLogs.filter(n=>n.date!==r.date);
    state.nutritionLogs.push({
      id:cryptoId(), date:r.date, meals:[{id:cryptoId(), label:'Other', calories:parseFloat(r.calories)}],
      protein: existing?existing.protein:0, carbs: existing?existing.carbs:0, fat: existing?existing.fat:0, water: existing?existing.water:0,
    });
  });

  await saveState();
  closeBulkEntry();
  showToast(`Saved ${candidates.length} day${candidates.length===1?'':'s'}.`);
  renderAll();
}

// ---------------- food search (Open Food Facts) ----------------
function openFoodSearch(mode){
  foodSearchMode = mode;
  foodMealCategory = 'Other';
  foodSearchQuery = '';
  foodSearchResults = [];
  foodSearchStatus = 'idle';
  foodIdleTab = 'recent';
  foodSelected = null;
  foodCreatingCustom = false;
  foodScanning = false;
  document.getElementById('food-overlay').classList.remove('hidden');
  renderFoodOverlay();
}

function closeFoodSearch(){
  stopScanStream();
  document.getElementById('food-overlay').classList.add('hidden');
}

function renderFoodOverlay(){
  const el = document.getElementById('food-overlay-body');
  if(foodCreatingCustom){
    el.innerHTML = foodCustomFormMarkup();
    bindCustomFoodFormHandlers();
  } else if(foodScanning){
    el.innerHTML = foodScanMarkup();
    bindBarcodeScanHandlers();
  } else if(foodSelected){
    el.innerHTML = foodDetailMarkup();
    bindFoodDetailHandlers();
  } else {
    el.innerHTML = foodSearchMarkup();
    bindFoodSearchHandlers();
    renderFoodResultsList();
  }
}

function foodSearchMarkup(){
  return `
    <div class="field" style="margin-bottom:10px;">
      <input type="text" id="food-search-input" placeholder="Search foods, e.g. &quot;chicken breast&quot;" value="${escapeHtml(foodSearchQuery)}" autocomplete="off">
    </div>
    <div style="display:flex; gap:16px; margin-bottom:14px;">
      <button type="button" class="btn-link" id="food-scan-open-btn">📷 Scan a barcode</button>
      <button type="button" class="btn-link" id="food-custom-btn">+ Create a custom food</button>
    </div>
    <div id="food-results-list"></div>
  `;
}

function bindFoodSearchHandlers(){
  const input = document.getElementById('food-search-input');
  input.focus();
  input.selectionStart = input.selectionEnd = input.value.length;
  let debounceTimer;
  input.oninput = ()=>{
    foodSearchQuery = input.value;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(()=> runFoodSearch(foodSearchQuery), 350);
  };
  document.getElementById('food-scan-open-btn').onclick = openBarcodeScan;
  document.getElementById('food-custom-btn').onclick = ()=>{ foodCreatingCustom = true; renderFoodOverlay(); };
}

async function runFoodSearch(query){
  const token = ++foodSearchToken;
  if(!query.trim()){
    foodSearchStatus = 'idle';
    foodSearchResults = [];
    renderFoodResultsList();
    return;
  }
  foodSearchStatus = 'loading';
  renderFoodResultsList();
  try{
    const { products } = await FoodService.searchFoods(query);
    if(token !== foodSearchToken) return; // a newer search superseded this one
    foodSearchResults = products;
    foodSearchStatus = products.length ? 'ok' : 'empty';
  }catch(e){
    if(token !== foodSearchToken) return;
    foodSearchStatus = 'error';
  }
  renderFoodResultsList();
}

function renderFoodResultsList(){
  const el = document.getElementById('food-results-list');
  if(!el) return;
  if(foodSearchStatus === 'loading'){
    el.innerHTML = `<div class="empty-state">Searching…</div>`;
    return;
  }
  if(foodSearchStatus === 'idle'){
    const list = foodIdleTab==='frequent' ? FoodService.getFrequentFoods(10) : FoodService.getRecentFoods().slice(0,10);
    el.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px;">
        <div class="chip-group" id="food-idle-tabs">
          <div class="chip${foodIdleTab==='recent'?' active':''}" data-tab="recent">Recent</div>
          <div class="chip${foodIdleTab==='frequent'?' active':''}" data-tab="frequent">Frequent</div>
        </div>
        ${list.length ? `<button type="button" class="btn-link" id="food-clear-all-btn" style="color:var(--danger); flex-shrink:0;">Clear all</button>` : ''}
      </div>
      ${list.length ? `<div class="stack">${list.map(f=>foodResultCardMarkup(f, {deleteAction:'history'})).join('')}</div>` : `<div class="empty-state">Search for a food to get started.</div>`}
    `;
    document.querySelectorAll('#food-idle-tabs .chip').forEach(chip=>{
      chip.onclick = ()=>{ foodIdleTab = chip.dataset.tab; renderFoodResultsList(); };
    });
    const clearBtn = document.getElementById('food-clear-all-btn');
    if(clearBtn){
      clearBtn.onclick = ()=>{
        if(confirm("Clear your entire recent/frequent food history? This can't be undone.")){
          FoodService.clearRecentFoods();
          renderFoodResultsList();
        }
      };
    }
    bindFoodResultClicks();
    return;
  }

  const customMatches = FoodService.searchCustomFoods(foodSearchQuery);
  const customSection = customMatches.length ? `
    <div class="section-title" style="font-size:12px; margin:0 0 10px;">Your foods</div>
    <div class="stack" style="margin-bottom:16px;">${customMatches.map(f=>foodResultCardMarkup(f, {deleteAction:'custom'})).join('')}</div>
  ` : '';

  if(foodSearchStatus === 'error'){
    el.innerHTML = customSection + `<div class="empty-state">Couldn't reach Open Food Facts. Check your connection and try again.</div>`;
    bindFoodResultClicks();
    return;
  }
  if(foodSearchStatus === 'empty' && customMatches.length===0){
    el.innerHTML = `<div class="empty-state">No foods found for "${escapeHtml(foodSearchQuery)}".</div>`;
    return;
  }
  const apiSection = foodSearchStatus === 'ok' ? `<div class="stack">${foodSearchResults.map(f=>foodResultCardMarkup(f)).join('')}</div>` : '';
  el.innerHTML = customSection + apiSection;
  bindFoodResultClicks();
}

function foodResultCardMarkup(f, opts){
  opts = opts || {};
  const cal = Math.round(f.per100.calories);
  return `
    <div class="food-result-card" data-food-id="${f.id}">
      ${f.imageUrl ? `<img class="food-thumb" src="${f.imageUrl}" alt="">` : `<div class="food-thumb-placeholder">🍽️</div>`}
      <div style="flex:1; min-width:0;">
        <div style="display:flex; justify-content:space-between; gap:8px;">
          <div style="font-weight:600; font-size:13.5px;">${escapeHtml(f.name)}</div>
          ${opts.deleteAction ? `<button type="button" class="del-btn food-delete-btn" data-food-id="${f.id}" data-delete-action="${opts.deleteAction}" aria-label="Remove">✕</button>` : ''}
        </div>
        ${f.brand ? `<div style="font-size:12px; color:var(--moss);">${escapeHtml(f.brand)}</div>` : ''}
        <div class="food-macro-row">
          <span>${cal} cal</span><span>${fmt(f.per100.protein,1)}g protein</span><span>${fmt(f.per100.carbs,1)}g carbs</span><span>${fmt(f.per100.fat,1)}g fat</span>
        </div>
        <div class="helper" style="margin-top:2px;">per 100g${f.servingSize? ` · serving: ${escapeHtml(f.servingSize)}`:''}</div>
      </div>
    </div>`;
}

function bindFoodResultClicks(){
  document.querySelectorAll('.food-result-card').forEach(card=>{
    card.onclick = ()=>{
      const id = card.dataset.foodId;
      const pool = foodSearchStatus==='idle'
        ? (foodIdleTab==='frequent' ? FoodService.getFrequentFoods(10) : FoodService.getRecentFoods())
        : [...FoodService.searchCustomFoods(foodSearchQuery), ...foodSearchResults];
      const food = pool.find(f=>f.id===id);
      if(food) selectFood(food);
    };
  });
  document.querySelectorAll('.food-delete-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.foodId;
      if(btn.dataset.deleteAction==='custom') FoodService.deleteCustomFood(id);
      else FoodService.removeRecentFood(id);
      renderFoodResultsList();
    };
  });
}

function selectFood(food){
  foodSelected = food;
  if(food.servingGrams){ foodServingUnit = 'serving'; foodServingQty = 1; }
  else { foodServingUnit = 'g'; foodServingQty = 100; }
  renderFoodOverlay();

// Uses the native BarcodeDetector API (Chrome/Edge) — no external library needed. Falls
// back to manual barcode entry (via FoodService.searchByBarcode) everywhere else.
function openBarcodeScan(){
  foodScanning = true;
  renderFoodOverlay();
}

function closeBarcodeScan(){
  foodScanning = false;
  stopScanStream();
  renderFoodOverlay();
}

function stopScanStream(){
  if(foodScanRAF) cancelAnimationFrame(foodScanRAF);
  foodScanRAF = null;
  if(foodScanStream){ foodScanStream.getTracks().forEach(t=>t.stop()); foodScanStream = null; }
}

function foodScanMarkup(){
  return `
    <div class="card stack">
      <div style="border-radius:12px; overflow:hidden; background:#000;">
        <video id="food-scan-video" autoplay playsinline muted style="width:100%; display:block;"></video>
      </div>
      <div class="helper" id="food-scan-status">Point your camera at a barcode.</div>
      <div class="field" style="margin-bottom:0;">
        <label>Or enter barcode manually</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="food-scan-manual" placeholder="e.g. 3017620422003" inputmode="numeric" style="flex:1;">
          <button type="button" class="btn btn-primary" id="food-scan-manual-btn" style="width:auto; padding:11px 16px;">Look up</button>
        </div>
      </div>
      <button type="button" class="btn btn-ghost" id="food-scan-cancel-btn">Cancel</button>
    </div>
  `;
}

async function bindBarcodeScanHandlers(){
  document.getElementById('food-scan-cancel-btn').onclick = closeBarcodeScan;
  document.getElementById('food-scan-manual-btn').onclick = ()=> lookupBarcode(document.getElementById('food-scan-manual').value);

  const statusEl = document.getElementById('food-scan-status');
  if(!('BarcodeDetector' in window)){
    statusEl.textContent = 'Live camera scanning needs Chrome or Edge on this device — enter the barcode number below instead.';
    return;
  }
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    statusEl.textContent = "Couldn't access the camera — enter the barcode number below instead.";
    return;
  }
  if(!foodScanning){ stream.getTracks().forEach(t=>t.stop()); return; } // overlay closed while awaiting camera permission
  foodScanStream = stream;
  const video = document.getElementById('food-scan-video');
  if(!video){ stopScanStream(); return; }
  video.srcObject = stream;

  const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e'] });
  const scanFrame = async ()=>{
    if(!foodScanning) return;
    try{
      const codes = await detector.detect(video);
      if(codes.length){ lookupBarcode(codes[0].rawValue); return; }
    }catch(e){}
    foodScanRAF = requestAnimationFrame(scanFrame);
  };
  video.onloadedmetadata = ()=> scanFrame();
}

async function lookupBarcode(code){
  code = (code||'').trim();
  if(!code) return;
  stopScanStream();
  const statusEl = document.getElementById('food-scan-status');
  if(statusEl) statusEl.textContent = 'Looking up…';
  try{
    const food = await FoodService.searchByBarcode(code);
    if(!food){ if(statusEl) statusEl.textContent = `No product found for barcode ${escapeHtml(code)}. Try a custom food instead.`; return; }
    foodScanning = false;
    selectFood(food);
  }catch(e){
    if(statusEl) statusEl.textContent = "Couldn't look up that barcode. Check your connection and try again.";
  }
}

// Adds the selected/scaled food as a calorie line-item to the active draft (reusing the
// still-blank default row, same convention as quickAddMeal), and folds its macros into the
// day's protein/carbs/fat fields — those are manual day-level totals (see data model), so a
// food-sourced item just adds on top of whatever's already typed in rather than replacing it.
function addFoodToMeal(){
  const f = foodSelected;
  const n = FoodService.calculateNutrition(f, foodServingQty, foodServingUnit);
  const arr = foodSearchMode==='new' ? activityDraftMeals : editActivityDraftMeals;
  const label = f.brand ? `${f.name} (${f.brand})` : f.name;
  const isBlankDefault = arr.length===1 && !arr[0].calories;
  const row = { id: isBlankDefault ? arr[0].id : cryptoId(), label: foodMealCategory, calories: n.calories, foodName: label };
  if(isBlankDefault){ arr[0] = row; } else { arr.push(row); }
  if(foodSearchMode==='new') activityDraftMeals = arr; else editActivityDraftMeals = arr;

  const prefix = foodSearchMode==='new' ? 'act' : 'eact';
  const proteinEl = document.getElementById(`${prefix}-protein`);
  const carbsEl = document.getElementById(`${prefix}-carbs`);
  const fatEl = document.getElementById(`${prefix}-fat`);
  if(proteinEl) proteinEl.value = fmt((parseFloat(proteinEl.value)||0) + n.protein, 1);
  if(carbsEl) carbsEl.value = fmt((parseFloat(carbsEl.value)||0) + n.carbs, 1);
  if(fatEl) fatEl.value = fmt((parseFloat(fatEl.value)||0) + n.fat, 1);

  FoodService.recordUsage(f);

  const containerId = `${prefix}-meals`;
  renderMealRows(containerId, arr, foodSearchMode);
  bindMealHandlers(foodSearchMode);
  closeFoodSearch();
  showToast(`Added ${label} — ${n.calories} cal`);
}

    : [emptyMealRow()];

    ? ex.activities.map(r=>({id:r.id||cryptoId(), type: EXERCISE_TYPES.includes(r.type)?r.type:'Other', durationMin:r.durationMin, caloriesBurned:r.caloriesBurned}))

async function saveEditActivity(originalDate){
  const date = document.getElementById('eact-date').value;
  const weightVal = weightInputToLbs(parseFloat(document.getElementById('eact-weight').value));
  const protein = parseFloat(document.getElementById('eact-protein').value) || 0;
  const carbs = parseFloat(document.getElementById('eact-carbs').value) || 0;
  const fat = parseFloat(document.getElementById('eact-fat').value) || 0;
  const water = parseFloat(document.getElementById('eact-water').value) || 0;
  const notes = document.getElementById('eact-notes').value.trim();
  const meals = editActivityDraftMeals
    .filter(m=> parseFloat(m.calories)>0)
    .map(m=>({id:m.id||cryptoId(), label: MEAL_CATEGORIES.includes(m.label)?m.label:'Other', calories: parseFloat(m.calories)||0, ...(m.foodName?{foodName:m.foodName}:{})}));
  const exercise = editActivityDraftExercise
    .filter(r=> parseFloat(r.durationMin)>0)
    .map(r=>({id:r.id||cryptoId(), type: EXERCISE_TYPES.includes(r.type)?r.type:'Other', durationMin: parseFloat(r.durationMin)||0, caloriesBurned: parseFloat(r.caloriesBurned)||0}));

  if(!date){ showToast('Enter a valid date.'); return; }
  const hasWeight = weightVal > 0;
  const hasMeals = meals.length > 0;
  const hasExercise = exercise.length > 0;
  if(!hasWeight && !hasMeals && !hasExercise){ showToast('Enter a weight, a calorie entry, or an exercise entry.'); return; }

  if(hasWeight){
    const existingId = state.weightLogs.find(l=>l.date===originalDate)?.id;
    const outlier = findWeightOutlier(weightVal, date, existingId);
    if(outlier && !confirm(`That's ${fmtWeight(outlier.diff,1)} ${weightUnitLabel()} from your last entry (${fmtWeight(outlier.mostRecent.weight)} ${weightUnitLabel()} on ${prettyDate(outlier.mostRecent.date)}). Save ${fmtWeight(weightVal)} ${weightUnitLabel()} anyway?`)){
      return;
    }
  }

  // clear both the original date and the (possibly new) target date, then re-add
  state.weightLogs = state.weightLogs.filter(l=> l.date!==originalDate && l.date!==date);
  state.nutritionLogs = state.nutritionLogs.filter(n=> n.date!==originalDate && n.date!==date);
  state.exerciseLogs = state.exerciseLogs.filter(e=> e.date!==originalDate && e.date!==date);
  if(hasWeight) state.weightLogs.push({id:cryptoId(), date, weight:weightVal, notes});
  if(hasMeals) state.nutritionLogs.push({id:cryptoId(), date, meals, protein, carbs, fat, water});
  if(hasExercise) state.exerciseLogs.push({id:cryptoId(), date, activities:exercise});

  editingActivityDate = null;
  await saveState();
  showToast('Entry updated.');
  renderAll();
}

async function deleteActivity(date){
  if(editingActivityDate===date) editingActivityDate = null;
  const removedWeight = state.weightLogs.filter(l=>l.date===date);
  const removedNutrition = state.nutritionLogs.filter(n=>n.date===date);
  const removedExercise = (state.exerciseLogs||[]).filter(e=>e.date===date);
  if(!removedWeight.length && !removedNutrition.length && !removedExercise.length) return;
  state.weightLogs = state.weightLogs.filter(l=>l.date!==date);
  state.nutritionLogs = state.nutritionLogs.filter(n=>n.date!==date);
  state.exerciseLogs = state.exerciseLogs.filter(e=>e.date!==date);
  await saveState();
  renderAll();
  showToast("Entry deleted.", { actionLabel:'Undo', duration:5000, onAction: async ()=>{
    // Guard against a new entry having been logged for this date in the meantime
    // (e.g. delete today's entry, quick-log a new one, then hit Undo) — restoring
    // unconditionally would create two logs sharing the same date, breaking the
    // "one entry per date" invariant the rolling average / trend math relies on.
    const weightConflict = state.weightLogs.some(l=>l.date===date);
    const nutritionConflict = state.nutritionLogs.some(n=>n.date===date);
    const exerciseConflict = state.exerciseLogs.some(e=>e.date===date);
    if(!weightConflict) state.weightLogs.push(...removedWeight);
    if(!nutritionConflict) state.nutritionLogs.push(...removedNutrition);
    if(!exerciseConflict) state.exerciseLogs.push(...removedExercise);
    await saveState();
    renderAll();
    if(weightConflict || nutritionConflict || exerciseConflict){
      showToast('Restored what we could — a new entry already exists for that date.');
    }
  }});
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// A same-DOM-node <details> is rebuilt fresh on every render call, so this just
// needs binding once per render — no dedup/cleanup required. Fades in whichever
// element follows <summary> when a disclosure is opened, for a smoother reveal.
function bindDisclosureAnimations(root){
  (root||document).querySelectorAll('details').forEach(d=>{
    d.addEventListener('toggle', ()=>{
      if(!d.open) return;
      const content = d.lastElementChild;
      if(!content || content.tagName==='SUMMARY') return;
      content.classList.remove('fade-in');
      void content.offsetWidth;
      content.classList.add('fade-in');
    });
  });
}

// ---------------- nav ----------------
function goTab(tab){
  activeTab = tab;
  ['dashboard','roadmap','log','settings'].forEach(t=>{
    document.getElementById('view-'+t).classList.toggle('hidden', t!==tab);
  });
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='log'){ renderLog(); }
  window.scrollTo(0,0);
}

function renderAll(){
  renderDashboard();
  renderRoadmap();
  renderLog();
  renderSettings();
}

async function boot(){
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');

  await loadState();

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('today-date').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'});

  if(!state.profile){
    document.getElementById('setup-screen').classList.remove('hidden');
    renderSetupScreen();
  } else {
    document.getElementById('app').classList.remove('hidden');
    renderAll();
    goTab(activeTab);
  }
  startReminderScheduler();
}

// ---------------- self-tests ----------------
// Lightweight in-page test harness — this app has no build step/test runner, so this
// runs real assertions against the actual functions above, directly in the browser,
// rather than adding an external test framework as a new dependency. Opt-in via
// ?selftest=1 so it never runs for a normal user. Snapshots and restores `state`
// around the run (several tests below intentionally mutate weightLogs/profile/etc. to
// set up scenarios) so running this against real data leaves it untouched.
function assertClose(actual, expected, tolerance, label, results){
  const pass = typeof actual==='number' && !isNaN(actual) && Math.abs(actual-expected) <= tolerance;
  results.push({ label, pass, detail: `expected ~${expected} (±${tolerance}), got ${actual}` });
}
function assertTrue(cond, label, results, detail){
  results.push({ label, pass: !!cond, detail: detail||String(cond) });
}
function assertEqual(actual, expected, label, results){
  const pass = actual===expected;
  results.push({ label, pass, detail: `expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}` });
}

function runSelfTests(){
  const results = [];
  const stateSnapshot = JSON.parse(JSON.stringify(state));
  const unitPrefsSnapshot = JSON.parse(JSON.stringify(state.unitPrefs));

  try{
    // --- unit conversion ---
    assertClose(lbsToKg(220.5), 100, 0.1, 'lbsToKg(220.5) ≈ 100kg', results);
    assertClose(kgToLbs(lbsToKg(187)), 187, 0.001, 'kg->lbs round-trip', results);
    assertClose(inToCm(cmToIn(177.8)), 177.8, 0.001, 'cm->in round-trip', results);
    state.unitPrefs = {weight:'kg', height:'cm'};
    assertEqual(fmtWeight(220.5,0), '100', 'fmtWeight converts to kg when metric', results);
    assertEqual(weightUnitLabel(), 'kg', 'weightUnitLabel reflects metric pref', results);
    state.unitPrefs = {weight:'lbs', height:'in'};
    assertEqual(fmtWeight(100,0), '100', 'fmtWeight stays lbs when imperial', results);

    // --- CSV escaping ---
    assertEqual(csvEscape('plain'), 'plain', 'csvEscape leaves plain text alone', results);
    assertEqual(csvEscape('a,b'), '"a,b"', 'csvEscape quotes a comma', results);
    assertEqual(csvEscape('say "hi"'), '"say ""hi"""', 'csvEscape doubles internal quotes', results);
    assertEqual(csvEscape(null), '', 'csvEscape turns null into empty string', results);

    // --- R² ---
    const perfectXs=[0,1,2,3,4], perfectYs=[200,199,198,197,196];
    const { slope:ps, intercept:pi } = leastSquaresSlope(perfectXs, perfectYs);
    assertClose(computeRSquared(perfectXs, perfectYs, ps, pi), 1, 0.001, 'R² = 1 for an exact line', results);
    const flatXs=[0,1,2,3,4], flatYs=[200,200,200,200,200];
    const { slope:fs, intercept:fi } = leastSquaresSlope(flatXs, flatYs);
    assertEqual(computeRSquared(flatXs, flatYs, fs, fi), 1, 'R² = 1 for zero-variance data (no scatter to explain)', results);

    // --- renderWeeklyInsight goal-awareness (Bug #1) ---
    function dstr(offset){ const d=new Date(); d.setDate(d.getDate()+offset); return d.toISOString().slice(0,10); }
    state.profile = { name:'t', startWeight:200, goalWeight:220, height:70, age:30, sex:'male', activityLevel:'moderate', goalType:'gain', multiplier:12, recommendedMultiplier:12, bmr:1800, tdee:2500, calcMode:'auto', deficit:500, interval:5, taperDeficit:false, createdDate: dstr(-30) };
    state.weightLogs = []; state.nutritionLogs = []; state.exerciseLogs = []; state.milestones = [];
    // gain-goal user LOSING weight (wrong direction) — must not say "great pace, keep going"
    for(let i=13;i>=0;i--) state.weightLogs.push({id:'wi'+i, date: dstr(-i), weight: 200 - (13-i)*0.3, notes:''});
    const wrongDirMsg = renderWeeklyInsight();
    assertTrue(!/Great pace/.test(wrongDirMsg), 'gain-goal losing weight is not praised as "great pace"', results, wrongDirMsg);
    assertTrue(/wrong way|hasn.t moved/.test(wrongDirMsg), 'gain-goal losing weight reads as off-track', results, wrongDirMsg);
    // gain-goal user GAINING weight (right direction) — should be encouraging, not "hasn't moved"
    state.weightLogs = [];
    for(let i=13;i>=0;i--) state.weightLogs.push({id:'wi'+i, date: dstr(-i), weight: 200 + (13-i)*0.3, notes:''});
    const rightDirMsg = renderWeeklyInsight();
    assertTrue(!/hasn.t moved much/.test(rightDirMsg), 'gain-goal gaining weight is not read as stalled', results, rightDirMsg);

    // --- milestone progress bar degenerate case (Bug #2) ---
    state.profile = Object.assign({}, state.profile, { goalType:'loss', startWeight:200, goalWeight:180, interval:5 });
    state.weightLogs = [{id:'deg1', date: dstr(0), weight:202, notes:''}]; // 2 lbs ABOVE start
    {
      const p = state.profile, phases = computePhases(p), avgW = rollingAverageWeight();
      const active = getActivePhase(phases, avgW);
      const activeIdx = phases.findIndex(ph=>ph.id===active.id);
      const prevTarget = activeIdx>0 ? phases[activeIdx-1].weightTarget : p.startWeight;
      const segmentGap = Math.abs(active.weightTarget - prevTarget);
      const segmentTotal = segmentGap > 0.01 ? segmentGap : (p.interval || 1);
      const segmentProgressed = segmentGap > 0.01 ? Math.max(0, Math.abs(avgW - prevTarget)) : 0;
      const pct = Math.max(0, Math.min(100, (segmentProgressed/segmentTotal)*100));
      assertEqual(pct, 0, 'milestone bar reads 0% (not false 100%) when above start weight', results);
    }

    // --- clothing size tie-break (Bug #5) ---
    {
      let tiePair = null;
      for(let i=0;i<FEMALE_SIZE_TABLE.length-1;i++){
        if(FEMALE_SIZE_TABLE[i].shirt !== FEMALE_SIZE_TABLE[i+1].shirt){ tiePair = [FEMALE_SIZE_TABLE[i], FEMALE_SIZE_TABLE[i+1]]; break; }
      }
      if(tiePair){
        const mid = (tiePair[0].weight + tiePair[1].weight)/2;
        const res = estimateSizeForWeight(mid, 'female');
        assertEqual(res.shirt, tiePair[1].shirt, 'exact-midpoint tie resolves to the larger size', results);
      }
    }

    // --- exercise-aware calibration ---
    state.profile = Object.assign({}, state.profile, { goalType:'loss', startWeight:200, goalWeight:180 });
    state.weightLogs = []; state.nutritionLogs = []; state.exerciseLogs = [];
    for(let i=27;i>=0;i--){
      state.weightLogs.push({id:'cw'+i, date: dstr(-i), weight: 200 - (27-i)*0.2, notes:''});
      state.nutritionLogs.push({id:'cn'+i, date: dstr(-i), meals:[{id:'cm'+i, label:'Other', calories:2200}], protein:0,carbs:0,fat:0,water:0});
    }
    const calBefore = computeCalibration();
    for(let i=10;i>=0;i--) state.exerciseLogs.push({id:'ce'+i, date: dstr(-i), activities:[{id:'cea'+i, type:'Run', durationMin:45, caloriesBurned:500}]});
    const calAfter = computeCalibration();
    assertTrue(calAfter.calibrationFactor < calBefore.calibrationFactor, 'logged exercise lowers the calibration factor (not misread as faster metabolism)', results, `${calBefore.calibrationFactor} -> ${calAfter.calibrationFactor}`);
    assertTrue(calAfter.avgDailyExerciseCalories > 0, 'calibration diagnostic reports avgDailyExerciseCalories', results);

    // --- calibration pause/resume ---
    state.profile.calibrationMode = 'paused';
    state.profile.frozenCalibrationFactor = calAfter.calibrationFactor;
    const phasesPausedA = computePhases(state.profile);
    state.nutritionLogs.push({id:'extra', date: dstr(0), meals:[{id:'mx',label:'Other',calories:4000}], protein:0,carbs:0,fat:0,water:0});
    const phasesPausedB = computePhases(state.profile);
    assertEqual(phasesPausedA[0].eating, phasesPausedB[0].eating, 'paused calibration holds steady across new logs', results);
    state.profile.calibrationMode = 'auto';
    const phasesResumed = computePhases(state.profile);
    assertTrue(phasesResumed[0].eating !== phasesPausedA[0].eating || computeCalibration().calibrationFactor===state.profile.frozenCalibrationFactor, 'resuming calibration re-reads the live factor', results);

    // --- date-based trend chart accounts for gaps ---
    state.weightLogs = [
      {id:'g1', date: dstr(-25), weight:202, notes:''},
      {id:'g2', date: dstr(-24), weight:201.8, notes:''},
      {id:'g3', date: dstr(-2), weight:197, notes:''},
      {id:'g4', date: dstr(-1), weight:196.8, notes:''},
    ];
    {
      const html = renderTrendChart();
      const xs = [...html.matchAll(/<circle cx="([\d.]+)" cy="[\d.]+" r="2.75"/g)].map(m=>parseFloat(m[1]));
      const gapSpacing = xs[2]-xs[1], denseSpacing = xs[1]-xs[0];
      assertTrue(xs.length===4 && gapSpacing > denseSpacing*5, 'trend chart x-axis spaces a 22-day gap much wider than consecutive days', results, `spacings: ${denseSpacing}, ${gapSpacing}`);
    }

    // --- exerciseCaloriesTotal / nutritionTotalCalories sanity ---
    assertEqual(exerciseCaloriesTotal([{caloriesBurned:100},{caloriesBurned:'50'},{caloriesBurned:''}]), 150, 'exerciseCaloriesTotal sums numeric fields, ignores blanks', results);

  } finally {
    state = stateSnapshot;
    state.unitPrefs = unitPrefsSnapshot;
    saveState();
    renderAll();
  }

  const failed = results.filter(r=>!r.pass);
  console.log(`Self-tests: ${results.length-failed.length}/${results.length} passed`);
  console.table(results.map(r=>({pass: r.pass?'✓':'✗', label:r.label, detail:r.detail})));
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed; inset:12px; background:#fff; z-index:9999; overflow:auto; padding:16px; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.3); font-family:monospace; font-size:12px;';
  box.innerHTML = `<h2 style="margin:0 0 10px;">Self-tests: ${results.length-failed.length}/${results.length} passed</h2>` +
    results.map(r=> `<div style="padding:4px 0; color:${r.pass?'#2B6355':'#B4553F'};">${r.pass?'✓':'✗'} ${r.label}${r.pass?'':` — ${r.detail}`}</div>`).join('') +
    `<button onclick="this.parentElement.remove()" style="margin-top:12px;">Close</button>`;
  document.body.appendChild(box);
  return { total: results.length, failed: failed.length, results };
}

boot();
if(new URLSearchParams(location.search).get('selftest')==='1'){
  setTimeout(runSelfTests, 300);
}
</script>
