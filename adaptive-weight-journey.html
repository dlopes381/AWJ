        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="disclosure-content">
        ${renderWeeklyInsight()}

        <details class="advanced-details" style="margin-top:8px;">
          <summary>Current strategy <span style="font-weight:400; color:var(--moss);">— ${deficitLabel}</span></summary>
          <div style="margin-top:12px;">
            ${hasBodyStats(p) && p.tdee ? `
              <div class="row2">
                <div><div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">Current strategy</div><div class="mono" style="font-weight:600; margin-top:4px;">${deficitLabel}</div></div>
                <div><div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">Calculated multiplier</div><div class="mono" style="font-weight:600; margin-top:4px;">${fmt(p.recommendedMultiplier)}x</div></div>
              </div>
              <div class="helper" style="margin-top:10px;">Starting calories were ${calcStartingCalories(p)} cal/day at ${fmtWeight(p.startWeight,0)} ${weightUnitLabel()}.${calibrationPaused? ` Calibration is paused — calorie targets are holding at a fixed ${fmt(Math.abs((getEffectiveCalibrationFactor(calibration)-1)*100),1)}% ${getEffectiveCalibrationFactor(calibration)>=1?'increase':'decrease'}.` : calibration?.active? ` Calorie targets are calibrated ${calibration.calibrationFactor>=1?'up':'down'} ${fmt(Math.abs((calibration.calibrationFactor-1)*100),1)}% based on your logged results.` : calibration && calibration.daysTracked>0? ` Calibration isn't active yet — needs ${calibration.daysNeeded} days of tracked history (${calibration.daysTracked} so far) to avoid overreacting to a short noisy stretch.` : ''}</div>
            ` : `
              <div class="helper">Add your height, age, sex, and activity level in Setup to see a personalized BMR/TDEE breakdown.</div>
            `}
            <button class="btn-link" style="margin-top:10px; display:block;" onclick="openCalcDetails()">View calculation details →</button>
          </div>
        </details>

        ${renderEstimatedTimeline()}

        <div class="section-title">Weight trend &amp; forecast</div>
        <div class="card">${renderWeightTrendCard()}</div>
        ${renderGoalForecastCard()}
        ${renderProgressCheckCard()}

        <div class="section-title">Journey</div>
        <div class="card trail-wrap">${renderTrailSVG(phases, avgW)}</div>
        <div class="helper" style="margin-top:8px;">Each dot marks a calorie-target phase from ${fmt(p.startWeight,0)} to ${fmtWeight(p.goalWeight,0)} ${weightUnitLabel()} — filled pine dots are reached, gold is your current step.</div>

        ${renderSizeEstimateCard(avgW, p.goalWeight, p.sex)}

        <div class="section-title">Rolling weight average <span style="font-weight:400; color:var(--moss); font-size:12px;">the trend that matters most</span></div>
        <div class="card">${renderRollingWeightChart()}</div>
        ${renderRollingWeightInsight()}

        <div class="section-title">Weight trend <span style="font-weight:400; color:var(--moss); font-size:12px;">daily readings</span></div>
        <div class="card">${renderTrendChart()}</div>

        <div class="section-title">Calorie breakdown</div>
        ${renderCalorieBreakdownCard()}

        <div class="section-title">Calorie intake trend <span style="font-weight:400; color:var(--moss); font-size:12px;">7-day &amp; 14-day rolling avg</span></div>
        <div class="card">${renderRollingCalorieChart()}</div>
      </div>
    </details>
  `;

  bindCalorieBreakdownControls();
  bindDisclosureAnimations(el);

  const quickWeightInput = document.getElementById('quick-weight-input');
  const quickCalInput = document.getElementById('quick-cal-input');
  const quickEntryBtn = document.getElementById('quick-entry-save');
  quickEntryBtn.onclick = async ()=>{
    // Today's entry already exists — hand off to the full Log tab's edit row
    // (itemized meals, protein/carbs/fat/water, notes) rather than re-saving
    // blind from these two bare fields.
    if(todaysLogged){
      goTab('log');
      startEditActivity(todayStr());
      return;
    }
    const weightRaw = quickWeightInput.value.trim();
    const calRaw = quickCalInput.value.trim();
    const weightVal = weightRaw ? weightInputToLbs(parseFloat(weightRaw)) : null;
    const calVal = calRaw ? parseFloat(calRaw) : null;
    if(weightRaw && !(weightVal>0)){ showToast('Enter a valid weight.'); return; }
    if(calRaw && !(calVal>=0)){ showToast('Enter a valid calorie amount.'); return; }
    await quickLogEntry(weightVal, calVal);
  };
  quickWeightInput.onkeydown = (e)=>{ if(e.key==='Enter') quickEntryBtn.click(); };
  quickCalInput.onkeydown = (e)=>{ if(e.key==='Enter') quickEntryBtn.click(); };
}

// ---------------- calculation details ----------------
function openCalcDetails(){
  renderCalcDetails();
  document.getElementById('details-overlay').classList.remove('hidden');
  window.scrollTo(0,0);
}
function closeCalcDetails(){
  document.getElementById('details-overlay').classList.add('hidden');
}

function detailRow(label, formula, result){
  return `
    <div class="log-entry" style="align-items:flex-start;">
      <div>
        <div class="log-date">${label}</div>
        <div class="log-note mono" style="max-width:none; margin-top:4px;">${formula}</div>
      </div>
      <div class="log-weight">${result}</div>
    </div>
  `;
}

function renderCalcDetails(){
  const p = state.profile;
  const body = document.getElementById('details-body');
  const phases = computePhases(p);
  const avgW = rollingAverageWeight();
  const active = getActivePhase(phases, avgW);
  const goalType = p.goalType || 'loss';
  const adjustWord = goalType==='gain' ? 'surplus' : goalType==='maintain' ? 'adjustment' : 'deficit';

  if(!hasBodyStats(p) || !p.tdee){
    const legacyAdjust = taperedAdjustment(p, active.weightTarget);
    body.innerHTML = `
      <p class="page-sub">This profile doesn't have body stats yet, so calories are estimated with a flat weight × multiplier formula instead of BMR/TDEE.</p>
      <div class="card stack">
        ${detailRow('Phase maintenance', `${fmtWeight(active.weightTarget,0)} ${weightUnitLabel()} × ${p.multiplier}`, `${active.maintenance} cal`)}
        ${detailRow(`Phase eating (${adjustWord})`, `${active.maintenance} cal ${goalType==='gain'?'+':'−'} ${legacyAdjust} cal`, `${active.eating} cal`)}
      </div>
      <p class="helper" style="text-align:center; margin-top:16px;">Add your height, age, sex, and activity level in Setup for a personalized BMR/TDEE-based estimate.</p>
    `;
    return;
  }

  const kg = fmt(p.startWeight/2.205, 1);
  const cm = fmt(p.height*2.54, 1);
  const sexLabel = p.sex==='male' ? 'Male' : 'Female';
  const sexConst = p.sex==='male' ? '+ 5' : '− 161';
  const bmrFormula = `(10 × ${kg}kg) + (6.25 × ${cm}cm) − (5 × ${p.age}) ${sexConst}`;
  const activityLabelMap = {sedentary:'Sedentary (1.20×)', light:'Light activity (1.375×)', moderate:'Moderate activity (1.55×)', veryActive:'Very active (1.725×)'};
  const startingCalories = calcStartingCalories(p);
  const calibration = computeCalibration();
  const calibrationPaused = (p.calibrationMode||'auto')==='paused';
  // Matches whatever computePhases() actually used for active.maintenance/eating above
  // (the live factor, or the frozen one if calibration is paused) — so the formula
  // shown here always reconciles with the result shown next to it.
  const calibrationFactor = getEffectiveCalibrationFactor(calibration);
  const phaseBmr = calcBMR(active.weightTarget, p.height, p.age, p.sex);
  const phaseAdjust = taperedAdjustment(p, active.weightTarget);
  const isTapered = p.taperDeficit && phaseAdjust !== p.deficit;

  body.innerHTML = `
    <p class="page-sub">How your calorie targets are calculated, from your body stats down to today's number.</p>

    <div class="section-title">Your inputs</div>
    <div class="card stack">
      ${detailRow('Weight', 'Starting weight', `${fmtWeight(p.startWeight,0)} ${weightUnitLabel()}`)}
      ${detailRow('Height', 'Entered in Setup', `${fmtHeight(p.height)} ${heightUnitLabel()}`)}
      ${detailRow('Age', 'Entered in Setup', `${fmt(p.age,0)}`)}
      ${detailRow('Sex', 'Used for the BMR formula', sexLabel)}
      ${detailRow('Activity level', 'Used for the TDEE multiplier', activityLabelMap[p.activityLevel] || p.activityLevel)}
    </div>

    <div class="section-title">BMR — resting calories</div>
    <div class="card">
      <div class="helper">Mifflin-St Jeor formula, converted to metric first (lbs ÷ 2.205 = kg, inches × 2.54 = cm).</div>
      <div class="log-entry" style="margin-top:12px; align-items:flex-start;">
        <div class="log-note mono" style="max-width:none;">${bmrFormula}</div>
        <div class="log-weight">${p.bmr} cal</div>
      </div>
    </div>

    <div class="section-title">TDEE — total daily energy</div>
    <div class="card">
      <div class="log-entry" style="align-items:flex-start;">
        <div class="log-note mono" style="max-width:none;">${p.bmr} cal × ${(ACTIVITY_MULTIPLIERS[p.activityLevel]||1.2)}</div>
        <div class="log-weight">${p.tdee} cal</div>
      </div>
    </div>

    <div class="section-title">Calculated multiplier</div>
    <div class="card">
      <div class="log-entry" style="align-items:flex-start;">
        <div class="log-note mono" style="max-width:none;">${p.tdee} cal ÷ ${fmtWeight(p.startWeight,0)} ${weightUnitLabel()}</div>
        <div class="log-weight">${fmt(p.recommendedMultiplier)}x</div>
      </div>
      <div class="helper" style="margin-top:10px;">${p.calcMode==='multiplier' ? `You're using a manual override of ${p.multiplier}x instead of the calculated value.` : 'This is a reference number — your actual calories are calculated from TDEE, not this multiplier.'}</div>
    </div>

    <div class="section-title">Starting calories (Day 1)</div>
    <div class="card">
      ${detailRow(`TDEE ${adjustWord}`, `${p.tdee} cal ${goalType==='gain'?'+':goalType==='maintain'?'':'−'} ${goalType==='maintain'?'':p.deficit+' cal'}`, `${startingCalories} cal`)}
      <div class="helper" style="margin-top:10px;">Fixed at setup — this doesn't change as your weight moves.</div>
    </div>

    <div class="section-title">Metabolic calibration</div>
    ${calibrationPaused ? `
    <div class="card">
      <div class="helper">⏸ Paused — calorie targets are holding at a fixed ${fmt(Math.abs((calibrationFactor-1)*100),1)}% ${calibrationFactor>=1?'increase':'decrease'} instead of adjusting automatically. Your logs and trend are still tracked underneath, so resuming later picks up fresh data.</div>
    </div>
    ` : calibration?.active ? `
    <div class="card">
      <div class="row2">
        <div><div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">Formula estimate</div><div class="mono" style="font-weight:600; margin-top:4px;">${calibration.calcTdee} cal</div></div>
        <div><div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">Your actual pace implies</div><div class="mono" style="font-weight:600; margin-top:4px;">${calibration.actualTdee} cal</div></div>
      </div>
      <div class="helper" style="margin-top:10px;">Based on ${calibration.avgDailyEaten} cal/day eaten vs. your weight trend, over your last ${calibration.nutritionLogs} food logs and ${calibration.weightLogs} weigh-ins spanning ${calibration.daysTracked} days (${calibration.windowDays}-day window).${calibration.exerciseLogs>0? ` Also nets out ~${calibration.avgDailyExerciseCalories} cal/day of logged exercise (${calibration.exerciseLogs} entr${calibration.exerciseLogs===1?'y':'ies'} in-window, only partially counted since exercise estimates run optimistic) so an unusually active stretch doesn't get credited as a faster metabolism.` : ''} Your calorie targets below are adjusted ${calibrationFactor>=1?'up':'down'} by ${fmt(Math.abs((calibrationFactor-1)*100),1)}% to match your real-world results.${calibration.clamped? ' (Capped at a 25% adjustment for stability.)':''}</div>
    </div>
    ` : calibration && (calibration.nutritionLogsTracked>0 || calibration.daysTracked>0) ? `
    <div class="card"><div class="helper">Not active yet — needs at least ${calibration.nutritionLogsNeeded} food logs (you have ${calibration.nutritionLogsTracked}) spanning ${calibration.daysNeeded} days (you have ${calibration.daysTracked}) within a ${CALIBRATION_WINDOW_DAYS}-day window. Requiring real elapsed time, not just a log count, keeps a short noisy stretch from swinging your targets before there's a reliable trend to go on.</div></div>
    ` : `
    <div class="card"><div class="helper">Log both your weight and calories consistently for a few weeks (at least ${MIN_CALIBRATION_NUTRITION_LOGS} food logs spanning ${CALIBRATION_MIN_SPAN_DAYS} days, within a ${CALIBRATION_WINDOW_DAYS}-day window) and we'll compare your actual results to the formula estimate to fine-tune your targets.</div></div>
    `}
    <p class="helper" style="text-align:center; margin-top:8px;">Turn automatic calibration on or off anytime from Settings → Advanced.</p>

    <div class="section-title">Current phase (${fmtWeight(active.weightTarget,0)} ${weightUnitLabel()})</div>
    <div class="card stack">
      ${detailRow('Phase BMR', `Recalculated at ${fmtWeight(active.weightTarget,0)} ${weightUnitLabel()} (same formula, new weight)`, `${phaseBmr} cal`)}
      ${detailRow('Phase TDEE', `${phaseBmr} cal × ${ACTIVITY_MULTIPLIERS[p.activityLevel]}${calibrationFactor!==1? ` × ${fmt(calibrationFactor,2)} calibration${calibrationPaused?' (frozen)':''}`:''}`, `${active.maintenance} cal`)}
      ${detailRow(`Phase eating (${adjustWord})`, `${active.maintenance} cal ${goalType==='gain'?'+':goalType==='maintain'?'':'−'} ${goalType==='maintain'?'':phaseAdjust+' cal'}${isTapered?' (tapered)':''}`, `${active.eating} cal`)}
      <div class="helper" style="margin-top:2px;">This is today's target — it steps automatically as your rolling average moves into a new phase, recalculated fresh at each phase's weight rather than scaled from your starting TDEE.</div>
    </div>
  `;
}

function renderTrailSVG(phases, cw){
  const n = phases.length;
  const stepX = 46;
  const w = Math.max(320, n*stepX + 40);
  const h = 130;
  const amp = 30;
  const baseY = h/2;
  const activeIdx = phases.findIndex(ph=>ph===getActivePhase(phases,cw));

  let pathD = '';
  const points = phases.map((ph,i)=>{
    const x = 24 + i*stepX;
    const y = baseY + Math.sin(i*0.9)*amp*0.6;
    return {x,y,ph,i};
  });
  points.forEach((pt,i)=>{
    pathD += (i===0? `M ${pt.x} ${pt.y}` : ` L ${pt.x} ${pt.y}`);
  });

  const completedPathPts = points.slice(0, activeIdx+1);
  let completedD = '';
  completedPathPts.forEach((pt,i)=>{ completedD += (i===0? `M ${pt.x} ${pt.y}` : ` L ${pt.x} ${pt.y}`); });

  const dots = points.map((pt,i)=>{
    let fill, stroke, r=6, status;
    if(i < activeIdx){ fill='var(--pine)'; stroke='var(--pine)'; status='Reached'; }
    else if(i === activeIdx){ fill='var(--gold)'; stroke='var(--gold)'; r=7.5; status='Current'; }
    else { fill='var(--card)'; stroke='var(--moss)'; status='Upcoming'; }
    const label = `${status} · ${fmtWeight(pt.ph.weightTarget,0)} ${weightUnitLabel()} · ${pt.ph.eating} cal/day`;
    return `<circle cx="${pt.x}" cy="${pt.y}" r="10" fill="transparent" style="cursor:pointer;" onmousemove="showTrailTip(event,'${label}')" onmouseleave="hideTrailTip()"></circle>
      <circle cx="${pt.x}" cy="${pt.y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5" style="pointer-events:none;"/>`;
  }).join('');

  return `<div class="trail-tip-wrap" style="position:relative;">
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
      <path d="${pathD}" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="1 8" stroke-linecap="round"/>
      <path d="${completedD}" fill="none" stroke="var(--pine)" stroke-width="3" stroke-linecap="round"/>
      ${dots}
    </svg>
    <div id="trail-tip" class="mono" style="display:none; position:absolute; pointer-events:none; background:var(--pine-dark); color:#fff; font-size:11.5px; padding:5px 9px; border-radius:8px; white-space:nowrap; transform:translate(-50%,-115%); z-index:5;"></div>
  </div>`;
}

// tipId defaults to 'trail-tip' so existing callers (the Trail chart) are unaffected;
// other charts on the same page pass their own tipId so tooltips don't collide.
function showTrailTip(evt, label, tipId){
  const tip = document.getElementById(tipId || 'trail-tip');
  const wrap = evt.currentTarget.closest('.trail-tip-wrap');
  if(!wrap || !tip) return;
  const rect = wrap.getBoundingClientRect();
  tip.textContent = label;
  tip.style.transform = 'translateY(-115%)';
  tip.style.left = '0px';
  tip.style.display = 'block';
  const x = evt.clientX - rect.left + wrap.scrollLeft;
  const half = tip.offsetWidth / 2;
  const clampedX = Math.min(Math.max(x, half), wrap.scrollWidth - half);
  tip.style.left = clampedX + 'px';
  tip.style.top = (evt.clientY - rect.top) + 'px';
  tip.style.transform = 'translate(-50%,-115%)';
}
function hideTrailTip(tipId){
  const tip = document.getElementById(tipId || 'trail-tip');
  if(tip) tip.style.display = 'none';
}

function leastSquaresSlope(xs, ys){
  const n = xs.length;
  const sumX = xs.reduce((a,b)=>a+b,0);
  const sumY = ys.reduce((a,b)=>a+b,0);
  const sumXY = xs.reduce((s,x,i)=> s + x*ys[i], 0);
  const sumX2 = xs.reduce((s,x)=> s + x*x, 0);
  const denom = (n*sumX2 - sumX*sumX);
  const slope = denom === 0 ? 0 : (n*sumXY - sumX*sumY) / denom; // lbs per day
  const intercept = (sumY - slope*sumX)/n;
  return { slope, intercept };
}

// Coefficient of determination (R²) for the same line leastSquaresSlope() fit: how
// much of the variance in the weigh-ins is explained by the straight trend line,
// vs. left over as day-to-day scatter around it. 1 = every point sits exactly on the
// line, 0 = the line explains none of the variance (pure noise). Returns null when
// undefined (fewer than 2 points, or every y identical so there's no variance to
// explain in the first place).
function computeRSquared(xs, ys, slope, intercept){
  const n = xs.length;
  if(n < 2) return null;
  const meanY = ys.reduce((a,b)=>a+b,0)/n;
  const ssTot = ys.reduce((s,y)=> s + (y-meanY)*(y-meanY), 0);
  if(ssTot === 0) return 1;
  const ssRes = ys.reduce((s,y,i)=> { const pred = intercept + slope*xs[i]; return s + (y-pred)*(y-pred); }, 0);
  return Math.max(0, 1 - ssRes/ssTot);
}

function computeTrend(logs = state.weightLogs){
  logs = [...logs].sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(logs.length < 2) return null;
  const first = new Date(logs[0].date);
  const xs = logs.map(l => (new Date(l.date) - first)/86400000);
  const ys = logs.map(l => l.weight);
  const { slope, intercept } = leastSquaresSlope(xs, ys);
  const slopePerWeek = slope*7;
  const r2 = computeRSquared(xs, ys, slope, intercept);
  return { logs, xs, ys, slope, intercept, slopePerWeek, r2 };
}

// ---------------- completion estimate ----------------
const COMPLETION_WINDOW_DAYS = 21;
const MIN_COMPLETION_POINTS = 4;
// A goal date is a long extrapolation from a short-term pace. Require a minimum
// tracking history, and cap how far past that history the projection is allowed
// to reach, so a few noisy days can't produce a wildly overconfident date.
const MIN_GOAL_TRACKING_DAYS = 21;
const MAX_GOAL_EXTRAPOLATION_RATIO = 6;
// Below this lbs/day magnitude a slope is treated as "not really moving" rather
// than confidently toward/away from a goal — shared by estimateCompletion() and
// getGoalProgressDirection() so "is this basically flat" means the same thing everywhere.
const TREND_NOISE_EPSILON = 0.02;

// Shared by estimateCompletion() and WeightTrendEngine.forecastGoal() so there's one
// definition of "enough history to trust a projection this far out" rather than two
// copies of the same guard that could quietly drift apart.
function isExtrapolationConfident(trackedDays, projectedDays){
  return trackedDays >= MIN_GOAL_TRACKING_DAYS && projectedDays <= trackedDays * MAX_GOAL_EXTRAPOLATION_RATIO;
}

// Uses only the most recent weigh-ins (not full history) so the estimate reflects
// current pace, not a stale average from before a diet/activity change. windowDays
// is anchored to the LATEST logged date, not calendar-today (same idiom as
// rollingWindowSeries) — a stale last weigh-in means a stale window, not a crash.
function computeRecentTrend(windowDays=COMPLETION_WINDOW_DAYS, logs=state.weightLogs){
  logs = [...logs].sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(logs.length < 2) return null;
  const lastDate = new Date(logs[logs.length-1].date);
  const cutoff = lastDate.getTime() - windowDays*86400000;
  const recentLogs = logs.filter(l=> new Date(l.date).getTime() >= cutoff);
  if(recentLogs.length < MIN_COMPLETION_POINTS) return null;
  const first = new Date(recentLogs[0].date);
  const xs = recentLogs.map(l => (new Date(l.date) - first)/86400000);
  const ys = recentLogs.map(l => l.weight);
  const { slope } = leastSquaresSlope(xs, ys);
  return { logs: recentLogs, slope, slopePerWeek: slope*7 };
}

function prettyDateObj(dt){
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}

function estimateCompletion(){
  const p = state.profile;
  if(isGoalReached()) return { status:'reached' };
  const recent = computeRecentTrend();
  if(!recent) return { status:'insufficient' };

  const dir = p.goalWeight >= p.startWeight ? 1 : -1;
  const movingTowardGoal = dir>0 ? recent.slope > TREND_NOISE_EPSILON : recent.slope < -TREND_NOISE_EPSILON;
  if(!movingTowardGoal) return { status:'stalled' };

  const avgW = rollingAverageWeight();
  const phases = computePhases(p);
  const active = getActivePhase(phases, avgW);
  const goalDistance = Math.max(0, dir>0 ? (p.goalWeight-avgW) : (avgW-p.goalWeight));
  const phaseDistance = Math.max(0, dir>0 ? (active.weightTarget-avgW) : (avgW-active.weightTarget));
  const pace = Math.abs(recent.slope);
  const goalDays = Math.round(goalDistance/pace);
  const phaseDays = Math.round(phaseDistance/pace);
  const today = new Date();
  const phaseDate = new Date(today.getTime() + phaseDays*86400000);

  const allLogs = [...state.weightLogs].sort((a,b)=> new Date(a.date)-new Date(b.date));
  const trackedDays = Math.round((new Date(allLogs[allLogs.length-1].date) - new Date(allLogs[0].date))/86400000);
  const goalConfident = isExtrapolationConfident(trackedDays, goalDays);
  const goalDate = goalConfident ? new Date(today.getTime() + goalDays*86400000) : null;

  return { status:'ok', goalDays, goalDate, goalConfident, trackedDays, phaseDays, phaseDate, windowLogs: recent.logs.length };
}

// Near-term "next phase" date only — the far-term "goal weight" date used to live
// here too, but as a single 21-day-window extrapolation it could silently disagree
// with the more conservative multi-window forecast now shown in the Goal forecast
// card below (see WeightTrendEngine), so that number moved there and became the
// sole "when will I reach my goal" figure app-wide.
function renderEstimatedTimeline(){
  const est = estimateCompletion();
  if(est.status==='reached') return '';
  if(est.status==='insufficient'){
    return `
      <div class="section-title">Estimated timeline</div>
      <div class="card"><div class="helper">Log at least ${MIN_COMPLETION_POINTS} weigh-ins within the last ${COMPLETION_WINDOW_DAYS} days to estimate when you'll reach your next calorie phase.</div></div>
    `;
  }
  if(est.status==='stalled'){
    return `
      <div class="section-title">Estimated timeline</div>
      <div class="card"><div class="helper">Your recent trend isn't moving in the right direction yet, so we can't estimate your next phase date.</div></div>
    `;
  }

  return `
    <div class="section-title">Estimated timeline</div>
    <div class="card">
      <div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">Next phase</div>
      <div class="mono" style="font-weight:600; font-size:16px; margin-top:4px;">${est.phaseDays<=0? 'Any day now' : prettyDateObj(est.phaseDate)}</div>
      <div class="helper" style="margin-top:2px;">${est.phaseDays<=0? 'Log to confirm' : `~${est.phaseDays} day${est.phaseDays===1?'':'s'} at current pace`}</div>
      <div class="helper" style="margin-top:10px;">Based on your trend over your last ${est.windowLogs} weigh-ins. Updates as you log more. See Weight trend &amp; forecast below for when you might reach your overall goal.</div>
    </div>
  `;
}

// A slope measured over just a day or two of noisy day-to-day weight fluctuation
// is too unreliable to extrapolate into a "lbs/week" claim (see estimateCompletion,
// which applies the same kind of guard to its longer-range projection).
const MIN_TREND_SPAN_DAYS = 4;

// ---------------- goal-progress direction (shared by the chart and the trend engine) ----------------
// One canonical definition of "is this rate of weight change moving toward the
// goal, away from it, or basically flat" — used by renderTrendChart's arrow/color
// below AND by WeightTrendEngine/the new trend UI, so the app never shows two
// different interpretations of the same raw slope side by side (e.g. a gain-goal
// user gaining weight is making progress and should read as good, not bad).
// positive = progress toward goal, negative = away, 0 = maintain (no progress axis)
function normalizeToGoalProgress(ratePerWeek, goalType){
  if((goalType||'loss')==='maintain') return 0;
  return goalType==='gain' ? ratePerWeek : -ratePerWeek;
}
// 'toward' | 'away' | 'neutral' — neutral covers both maintain and a near-flat rate
function getGoalProgressDirection(ratePerWeek, goalType){
  if((goalType||'loss')==='maintain') return 'neutral';
  const n = normalizeToGoalProgress(ratePerWeek, goalType);
  if(Math.abs(n) < TREND_NOISE_EPSILON*7) return 'neutral';
  return n > 0 ? 'toward' : 'away';
}

function renderTrendChart(){
  const p = state.profile;
  const goalType = p.goalType || 'loss';
  const trend = computeTrend();
  if(!trend){
    return `<div class="empty-state">Log at least 2 weigh-ins to see your trend.</div>`;
  }
  const { logs, ys, slope, intercept, xs, slopePerWeek } = trend;
  const n = logs.length;
  const daysSpan = xs[n-1] - xs[0];
  // Real calendar-date x-axis (xs[i] is already "days since the first weigh-in," from
  // computeTrend) instead of equally-spaced indexes — a logging gap now shows as an
  // actual gap on the chart, and the trend line/projection extend by real elapsed
  // days rather than an approximated "average spacing between points."
  const pxPerDay = Math.max(2, Math.min(50, 340/(daysSpan||1)));
  const padTop=18, padBottom=34, padLeft=14;
  const w = Math.max(280, padLeft*2 + daysSpan*pxPerDay);
  const h = 150;
  const minW = Math.min(...ys), maxW = Math.max(...ys);
  const range = (maxW - minW) || 1;
  const plotTop = padTop, plotBottom = h - padBottom;
  const mapY = (val)=> plotTop + ( (maxW - val) / range ) * (plotBottom - plotTop);
  const mapX = (dayOffset)=> padLeft + dayOffset*pxPerDay;

  let lineD = '';
  logs.forEach((l,i)=>{
    const x = mapX(xs[i]), y = mapY(l.weight);
    lineD += (i===0? `M ${x} ${y}` : ` L ${x} ${y}`);
  });

  const yStart = intercept + xs[0]*slope;
  const yEnd = intercept + xs[n-1]*slope;
  const trendX1 = mapX(xs[0]), trendY1 = mapY(yStart);
  const trendX2 = mapX(xs[n-1]), trendY2 = mapY(yEnd);

  // A handful of date tick labels along the bottom so the axis reads as real elapsed
  // time, not just "point 1, point 2, ...". At most 5, evenly spaced by day offset
  // (not by point index), skipped entirely on a very narrow/short-span chart.
  const tickCount = daysSpan>=3 ? Math.min(5, Math.max(2, Math.round(w/90))) : 0;
  const dateTicks = [];
  for(let t=0;t<tickCount;t++){
    const dayOffset = tickCount===1 ? 0 : (daysSpan * t/(tickCount-1));
    const d = new Date(logs[0].date+'T00:00:00'); d.setDate(d.getDate()+Math.round(dayOffset));
    dateTicks.push({ x: mapX(dayOffset), label: prettyDateObj(d) });
  }

  // The bucket below describes literal weight movement (accurate regardless of
  // goal); the COLOR reflects whether that movement is progress toward THIS
  // profile's goal (getGoalProgressDirection) — magnitude breakpoints (0.25/2.5)
  // are the same numbers the chart already used, just applied symmetrically via
  // magnitude instead of only on the loss side.
  const magnitude = Math.abs(slopePerWeek);
  let color, label, arrow;
  if(daysSpan < MIN_TREND_SPAN_DAYS){
    color='var(--moss)'; label=`Only ${Math.round(daysSpan)} day${Math.round(daysSpan)===1?'':'s'} of history so far — keep logging for a reliable weekly trend`; arrow='flat';
  } else if(magnitude < 0.25){
    color='var(--moss)'; label='Roughly flat this stretch'; arrow='flat';
  } else {
    const direction = getGoalProgressDirection(slopePerWeek, goalType);
    const goingDown = slopePerWeek < 0;
    arrow = goingDown ? 'down' : 'up';
    const verb = goingDown ? 'Losing' : 'Gaining';
    const fast = magnitude >= 2.5;
    label = (direction==='toward' && fast)
      ? `${verb} fast — about ${fmtWeight(magnitude)} ${weightUnitLabel()}/week`
      : `Trending ${goingDown?'down':'up'} — about ${fmtWeight(magnitude)} ${weightUnitLabel()}/week`;
    color = direction==='toward' ? (fast ? 'var(--gold)' : 'var(--pine)') : direction==='away' ? 'var(--danger)' : 'var(--moss)';
  }
  const arrowGlyph = arrow==='down' ? '&#8595;' : arrow==='up' ? '&#8593;' : '&#8594;';

  // Daily readings are shown as light, secondary context — the dashed trend line
  // (and the Rolling weight average chart above) are the more meaningful signal.
  const dots = logs.map((l,i)=>{
    const x = mapX(xs[i]), y = mapY(l.weight);
    const tipLabel = `${prettyDate(l.date)} — ${fmtWeight(l.weight)} ${weightUnitLabel()}`;
    return `<circle cx="${x}" cy="${y}" r="10" fill="transparent" style="cursor:pointer;" onmousemove="showTrailTip(event,'${tipLabel}','trend-tip')" onmouseleave="hideTrailTip('trend-tip')"></circle>
      <circle cx="${x}" cy="${y}" r="2.75" fill="var(--card)" stroke="var(--moss)" stroke-width="1.2" style="pointer-events:none;"/>`;
  }).join('');

  const axisLabels = dateTicks.map(t=> `<text x="${t.x}" y="${h-10}" text-anchor="middle" font-size="9.5" fill="var(--moss)" font-family="'IBM Plex Mono'">${t.label}</text>`).join('');

  // Goal reference line: only drawn when the goal falls within a bounded margin of
  // the plotted range, so a goal far outside current readings doesn't flatten the
  // whole chart into an unreadable near-flat line.
  const showGoalLine = goalType!=='maintain' && p.goalWeight >= minW - range*1.5 && p.goalWeight <= maxW + range*1.5;
  const goalY = showGoalLine ? mapY(p.goalWeight) : null;

  // Forward projection: tied to the SAME forecastGoal() used by the Goal Forecast
  // card below (single source of truth, not a separate heuristic) — only drawn when
  // that forecast is confident AND the goal line itself is visible. Now that the
  // x-axis is date-based, the projection's x position is just the forecast's real
  // day-distance past the last point — no more approximating an "average spacing
  // between points" to fake it.
  const forecast = showGoalLine ? WeightTrendEngine.forecastGoal(p, rollingAverageWeight(), WeightTrendEngine.analyze()) : null;
  const showProjection = !!(forecast && forecast.status==='ok' && forecast.confident);
  let projX = null;
  if(showProjection){
    const daysUntilForecast = Math.max(0, Math.round((forecast.forecastDate - new Date())/86400000));
    projX = Math.min(mapX(xs[n-1] + daysUntilForecast), w - padLeft*0.6);
  }

  return `
    <div class="trend-label">
      <span class="trend-arrow" style="background:${color}22; color:${color};">${arrowGlyph}</span>
      <span style="color:${color};">${label}</span>
    </div>
    <div class="trail-wrap trail-tip-wrap" style="position:relative;">
      <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
        ${showGoalLine ? `<line x1="${padLeft}" y1="${goalY}" x2="${w-padLeft}" y2="${goalY}" stroke="var(--moss)" stroke-width="1.5" stroke-dasharray="3 4"/>
        <text x="${w-padLeft}" y="${goalY-5}" text-anchor="end" font-size="10" fill="var(--moss)" font-family="'IBM Plex Mono'">Goal ${fmtWeight(p.goalWeight,0)}</text>` : ''}
        <path d="${lineD}" fill="none" stroke="var(--line)" stroke-width="1.5"/>
        <line x1="${trendX1}" y1="${trendY1}" x2="${trendX2}" y2="${trendY2}" stroke="${color}" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/>
        ${showProjection ? `<line x1="${mapX(xs[n-1])}" y1="${mapY(logs[n-1].weight)}" x2="${projX}" y2="${goalY}" stroke="${color}" stroke-width="2" stroke-dasharray="1.5 3.5" stroke-linecap="round" opacity="0.55"/>
        <text x="${projX}" y="${goalY-5}" text-anchor="end" font-size="10" fill="${color}" font-family="'IBM Plex Mono'" opacity="0.85">(projected)</text>` : ''}
        ${dots}
        <line x1="${padLeft}" y1="${plotBottom+8}" x2="${w-padLeft}" y2="${plotBottom+8}" stroke="var(--line)" stroke-width="1"/>
        ${axisLabels}
      </svg>
      <div id="trend-tip" class="mono" style="display:none; position:absolute; pointer-events:none; background:var(--pine-dark); color:#fff; font-size:11.5px; padding:5px 9px; border-radius:8px; white-space:nowrap; transform:translate(-50%,-115%); z-index:5;"></div>
    </div>
    <div class="trend-sub">Based on your last ${n} weigh-ins, from ${prettyDate(logs[0].date)} to ${prettyDate(logs[n-1].date)} (${Math.round(daysSpan)} day${Math.round(daysSpan)===1?'':'s'} elapsed). Daily readings are shown light — see Rolling weight average above for the smoother trend.</div>
  `;
}

// ---------------- rolling average charts (7-day / 14-day) ----------------
// Unlike rollingAverageWeight() (last N log entries), these average by trailing
// calendar days so the window reflects actual elapsed time even with logging gaps.
function rollingWindowSeries(sortedLogs, dateKey, valueFn, windowDays){
  return sortedLogs.map(entry=>{
    const d = new Date(entry[dateKey]).getTime();
    const cutoff = d - (windowDays-1)*86400000;
    const inWindow = sortedLogs.filter(e=>{
      const t = new Date(e[dateKey]).getTime();
      return t >= cutoff && t <= d;
    });
    return inWindow.reduce((s,e)=>s+valueFn(e),0)/inWindow.length;
  });
}

function renderRollingLineChart(logs, dateKey, valueFn, opts={}){
  const unit = opts.unit || '';
  const decimals = opts.decimals===undefined ? 1 : opts.decimals;
  const sorted = [...logs].sort((a,b)=> new Date(a[dateKey])-new Date(b[dateKey]));
  if(sorted.length < 2){
    return `<div class="empty-state">Log at least 2 days to see rolling averages.</div>`;
  }
  const r7 = rollingWindowSeries(sorted, dateKey, valueFn, 7);
  const r14 = rollingWindowSeries(sorted, dateKey, valueFn, 14);
  const n = sorted.length;
  const stepX = Math.max(28, Math.min(50, 340/(n-1||1)));
  const padTop=18, padBottom=26, padLeft=14;
  const w = Math.max(280, padLeft*2 + (n-1)*stepX);
  const h = 150;
  const allVals = [...r7, ...r14];
  const minV = Math.min(...allVals), maxV = Math.max(...allVals);
  const range = (maxV - minV) || 1;
  const plotTop = padTop, plotBottom = h - padBottom;
  const mapY = (val)=> plotTop + ((maxV - val)/range) * (plotBottom - plotTop);
  const mapX = (i)=> padLeft + i*stepX;
  const pathFor = (series)=> series.map((v,i)=> (i===0? `M ${mapX(i)} ${mapY(v)}` : ` L ${mapX(i)} ${mapY(v)}`)).join('');
  // 14-day is the primary/headline trend (solid line + dots, drawn on top); 7-day is
  // secondary context (dashed, drawn underneath) — the 14-day window is less noisy
  // day-to-day and is what the user wants to focus on.
  const tipId = opts.tipId || 'rolling-tip';
  const dots14 = r14.map((v,i)=>{
    const x = mapX(i), y = mapY(v);
    const tipLabel = `${prettyDate(sorted[i][dateKey])} — 14-day: ${fmt(v,decimals)}${unit}, 7-day: ${fmt(r7[i],decimals)}${unit}`;
    return `<circle cx="${x}" cy="${y}" r="10" fill="transparent" style="cursor:pointer;" onmousemove="showTrailTip(event,'${tipLabel}','${tipId}')" onmouseleave="hideTrailTip('${tipId}')"></circle>
      <circle cx="${x}" cy="${y}" r="2.5" fill="var(--pine)" style="pointer-events:none;"/>`;
  }).join('');
  const last7 = r7[r7.length-1], last14 = r14[r14.length-1];

  return `
    <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:10px; font-size:13px;">
      <span style="display:flex; align-items:center; gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:var(--pine);"></span>14-day avg: <strong class="mono">${fmt(last14,decimals)}${unit}</strong></span>
      <span style="display:flex; align-items:center; gap:6px;"><span style="width:10px;height:2px;background:var(--gold);"></span>7-day avg: <strong class="mono">${fmt(last7,decimals)}${unit}</strong></span>
    </div>
    <div class="trail-wrap trail-tip-wrap" style="position:relative;">
      <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
        <path d="${pathFor(r7)}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" opacity="0.75"/>
        <path d="${pathFor(r14)}" fill="none" stroke="var(--pine)" stroke-width="3" stroke-linecap="round"/>
        ${dots14}
      </svg>
      <div id="${tipId}" class="mono" style="display:none; position:absolute; pointer-events:none; background:var(--pine-dark); color:#fff; font-size:11.5px; padding:5px 9px; border-radius:8px; white-space:nowrap; transform:translate(-50%,-115%); z-index:5;"></div>
    </div>
    <div class="trend-sub">Rolling averages from ${prettyDate(sorted[0][dateKey])} to ${prettyDate(sorted[n-1][dateKey])}, based on ${n} logged day${n===1?'':'s'}.</div>
  `;
}

function renderRollingWeightChart(){
  return renderRollingLineChart(state.weightLogs, 'date', l=>isMetricWeight()?lbsToKg(l.weight):l.weight, {unit:' '+weightUnitLabel(), decimals:1, tipId:'rollw-tip'});
}

function renderRollingCalorieChart(){
  return renderRollingLineChart(state.nutritionLogs, 'date', n=>nutritionTotalCalories(n), {unit:' cal', decimals:0, tipId:'rollc-tip'});
}

// Momentum read on the 7-day vs 14-day rolling averages themselves (distinct from
// renderWeeklyInsight's raw last-7-vs-prior-7 comparison): since the 14-day window
// fully contains the 7-day one, (14-day avg − 7-day avg) approximates half of the
// last week's rate of change under a roughly linear trend, so doubling it gives a
// comparable "implied lbs/week" figure. Reuses estimateCompletion() for any "days to
// next phase" figure rather than deriving a second, possibly-conflicting estimate.
function renderRollingWeightInsight(){
  const sorted = [...state.weightLogs].sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(sorted.length < 7) return '';
  const r7 = rollingWindowSeries(sorted, 'date', l=>l.weight, 7);
  const r14 = rollingWindowSeries(sorted, 'date', l=>l.weight, 14);
  const last7 = r7[r7.length-1], last14 = r14[r14.length-1];

  const p = state.profile;
  const goalType = p.goalType || 'loss';
  const goalDir = goalType==='gain' ? -1 : 1; // for gain, "good" momentum is the opposite sign of raw
  const raw = last14 - last7; // positive when the 7-day average sits below the 14-day average
  const impliedWeeklyRate = raw * 2 * goalDir;

  let msg;
  if(goalType==='maintain'){
    if(Math.abs(impliedWeeklyRate) <= 1){
      msg = `Your 7-day and 14-day averages are close together — you're holding steady right around your maintenance target.`;
    } else if(raw > 0){
      msg = `Your 7-day average has dipped below your 14-day average — you're trending down about ${fmtWeight(Math.abs(impliedWeeklyRate))} ${weightUnitLabel()}/week. Consider adding a bit more food to stay level.`;
    } else {
      msg = `Your 7-day average has crept above your 14-day average — you're trending up about ${fmtWeight(Math.abs(impliedWeeklyRate))} ${weightUnitLabel()}/week. A small trim to calories should bring you back to level.`;
    }
  } else {
    const verb = goalType==='gain' ? 'gaining' : 'losing';
    if(impliedWeeklyRate < 0){
      msg = `Your 7-day average is ${goalType==='gain'?'below':'above'} your 14-day average — recent progress has slowed or reversed slightly (about ${fmtWeight(Math.abs(impliedWeeklyRate))} ${weightUnitLabel()}/week the wrong way). Double-check you're consistently hitting your calorie target.`;
    } else if(impliedWeeklyRate > 3){
      msg = `You're ${verb} faster than your recent baseline — about ${fmtWeight(impliedWeeklyRate)} ${weightUnitLabel()}/week over the last week. That's ahead of the typical 1–2 lb/week pace; consider ${goalType==='gain'?'trimming back slightly':'adding 100–200 calories'} to keep it sustainable.`;
    } else if(impliedWeeklyRate >= 1){
      msg = `Nice momentum — your 7-day average is pulling your 14-day average ${goalType==='gain'?'up':'down'} at a solid ~${fmtWeight(impliedWeeklyRate)} ${weightUnitLabel()}/week.`;
    } else {
      msg = `Your 7-day and 14-day averages are nearly flat against each other — progress has slowed to under a pound a week. If this continues, consider adjusting your calorie target.`;
    }
    if(!isGoalReached()){
      const phases = computePhases(p);
      const dir = phaseDirection(phases);
      const avgW = rollingAverageWeight();
      const active = getActivePhase(phases, avgW);
      const distance = Math.max(0, dir>0 ? (active.weightTarget-avgW) : (avgW-active.weightTarget));
      if(distance > 0){
        const completion = estimateCompletion();
        const etaNote = completion.status==='ok' && completion.phaseDate ? `, estimated around ${prettyDateObj(completion.phaseDate)} at your current pace` : '';
        msg += ` You're ${fmtWeight(distance,1)} ${weightUnitLabel()} from your next calorie step at ${fmtWeight(active.weightTarget,0)} ${weightUnitLabel()}${etaNote}.`;
      }
    }
  }

  return `<div class="banner" style="margin-top:12px;">📈 <div>${msg}</div></div>`;
}

function renderWeeklyInsight(){
  const logs = [...state.weightLogs].sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(logs.length < 4) return '';
  const p = state.profile;
  const goalType = p.goalType || 'loss';
  // Local-midnight "today" (same idiom as todayStr()) compared against dates also
  // parsed as local midnight — comparing a bare `new Date()` (real wall-clock) against
  // `new Date(dateString)` (parsed as UTC midnight) could shift a borderline weigh-in
  // into the wrong 7-day bucket for timezones behind UTC.
  const today = new Date(todayStr()+'T00:00:00');
  const withinDays = (d, days)=> (today - new Date(d+'T00:00:00')) / 86400000 <= days;
  const last7 = logs.filter(l=> withinDays(l.date,7));
  const prev7 = logs.filter(l=> { const days = (today-new Date(l.date+'T00:00:00'))/86400000; return days>7 && days<=14; });
  if(last7.length<2 || prev7.length<2) return '';
  const avg = arr => arr.reduce((s,l)=>s+l.weight,0)/arr.length;
  const rawWeeklyChange = avg(last7) - avg(prev7); // positive = weight increased week-over-week

  let msg;
  if(goalType==='maintain'){
    const drift = -rawWeeklyChange; // positive = trending down, negative = trending up
    if(Math.abs(drift) <= 1){ msg = `You're averaging about ${fmtWeight(Math.abs(drift))} ${weightUnitLabel()}/week of drift — holding steady right around your maintenance target.`; }
    else { msg = `You're trending ${drift>0?'down':'up'} about ${fmtWeight(Math.abs(drift))} ${weightUnitLabel()}/week this week. If this continues, consider a small calorie ${drift>0?'increase':'decrease'} to come back to level.`; }
  } else {
    // Normalized so positive always means "toward this profile's goal" (same
    // convention as renderRollingWeightInsight/WeightTrendEngine) — otherwise a
    // gain-goal user successfully gaining reads as "hasn't moved," and one who's
    // accidentally losing reads as "great pace, keep going."
    const rate = normalizeToGoalProgress(rawWeeklyChange, goalType);
    const verb = goalType==='gain' ? 'gaining' : 'losing';
    if(rate > 3){ msg = `You're averaging about ${fmtWeight(rate)} ${weightUnitLabel()}/week ${verb} — faster than the ideal 1–2 lbs. Consider ${goalType==='gain'?'trimming back slightly':'adding 100–200 calories'} to protect your energy and muscle.`; }
    else if(rate >= 1){ msg = `Great pace — you're averaging about ${fmtWeight(rate)} ${weightUnitLabel()}/week ${verb}, right in the ideal 1–2 lb range. Keep going.`; }
    else if(rate > 0){ msg = `Progress has slowed to about ${fmtWeight(rate)} ${weightUnitLabel()}/week. If this continues for a few more weeks, consider a small calorie ${goalType==='gain'?'increase':'cut'} or adjusting activity.`; }
    else { msg = `Your weight ${rate<0 ? 'moved the wrong way' : "hasn't moved much"} this week. That's normal short-term — keep logging and watch the weekly trend.`; }
  }

  // This 2-week snapshot can visibly disagree with the longer-history Weight trend
  // chart if a single unusual weigh-in falls inside one of the 7-day windows — flag
  // it rather than leave two contradictory-looking numbers unexplained on the page.
  const trend = computeTrend();
  if(trend){
    const longTermRate = goalType==='maintain' ? -trend.slopePerWeek : normalizeToGoalProgress(trend.slopePerWeek, goalType);
    const shortTermRate = goalType==='maintain' ? -rawWeeklyChange : normalizeToGoalProgress(rawWeeklyChange, goalType);
    if(Math.abs(shortTermRate - longTermRate) > 2){
      msg += ` (Your longer-term Weight trend below tells a different story — a single unusual weigh-in in the last two weeks can skew this short-term number.)`;
    }
  }
  return `<div class="section-title">Weekly insight</div><div class="banner">📊 <div>${msg}</div></div>`;
}

// ---------------- weight trend & forecast ----------------
// "What's happening" layer: pure calculation over weightLogs, no writes to state,
// no influence on calorie/calibration math (computePhases/computeCalibration are
// untouched by anything below — the trend system observes, the adaptive engine
// decides). Confidence and the noise/extrapolation guards reuse the same
// thresholds as estimateCompletion()/computeCalibration() rather than inventing
// new ones — one definition of "enough data to trust a trend" across the app.
//
// Two DIFFERENT window-selection policies answer two different questions, and the
// distinction is load-bearing — never collapse these into one generic "trend":
//   currentTrend       "what's happening recently?" — prefers 14d, then 7d, then
//                       30d. 14-day is the balance point between 7-day noise and
//                       30-day staleness: hand-testing showed preferring the
//                       longest window either badly understates a real recent
//                       acceleration (e.g. 30d=-0.2/14d=-1.8/7d=-2.0) or falsely
//                       papers over a recent stall (30d=-2.0/14d=-0.4/7d=+1.5).
//   forecastBasisWindow "what rate is safe to extrapolate months out?" — prefers
//                       30d, then 14d, then 7d, then gets clamped against the
//                       all-time `overall` trend below.
//   overall             full-history regression, intentionally ALL-TIME — not
//                       scoped to the current profile/goal (same v1 boundary as
//                       estimateCompletion()'s existing trackedDays gate). A user
//                       who changed goals/regimes mid-history can see this produce
//                       a 'conflicting' forecast rather than a falsely precise
//                       date — the safe failure mode. This limitation belongs to
//                       forecastBasisWindow's clamp specifically, not to
//                       currentTrend, which the 14-day-preferred policy already
//                       answers cleanly on its own.
const PROGRESS_CHECK_TOLERANCE_RATIO = 0.35;
const PROGRESS_CHECK_TOLERANCE_FLOOR = 0.3;
// A single one-day outlier has outsized leverage on a short regression window (a
// +9lb spike at the most recent point of a 7-day window can flip the slope from
// -0.75 to +6 lb/week; the same spike mid-window barely moves it, since a point at
// the window's mean x has ~zero leverage on slope by construction). Rather than
// modify the regression or the data, flag it: when the raw 7-day rate diverges
// sharply from the chosen currentTrend, say so — same reconciliation-note pattern
// already shipped above in renderWeeklyInsight (Math.abs(rate-longTermRate)>2).
const TREND_DIVERGENCE_THRESHOLD = 2;
// R² above this reads as "steady" (the trend line explains most of the scatter),
// below as "variable" — deliberately not a high bar: real day-to-day weight
// fluctuation (water, salt, GI contents) keeps even a genuinely consistent trend's R²
// well under 1, so demanding e.g. 0.8 would call almost everyone "variable."
const TREND_CONSISTENCY_R2_THRESHOLD = 0.5;
// Below this average logs/week, a dataset is too gappy for R² to say much about
// day-to-day consistency either way (a few scattered points over a long span can
// post a deceptively high OR low R²) — trendConsistency() bows out to null instead.
const TREND_CONSISTENCY_MIN_LOGS_PER_WEEK = 1;

const WeightTrendEngine = {
  analyze(weightLogs = state.weightLogs){
    const windows = {
      7: computeRecentTrend(7, weightLogs),
      14: computeRecentTrend(14, weightLogs),
      30: computeRecentTrend(30, weightLogs),
    };
    const overall = computeTrend(weightLogs);
    const currentTrend = this.pickWindow(windows, [14,7,30]);
    const forecastBasisWindow = this.pickWindow(windows, [30,14,7]);
    const confidence = this.trendConfidence(weightLogs, overall);
    const consistency = this.trendConsistency(weightLogs, overall);
    const { forecastRatePerWeek, forecastStatus } = this.calculateForecastRate(forecastBasisWindow, overall, currentTrend, confidence);
    const divergenceNote = this.divergenceNote(windows[7], currentTrend);
    return { windows, overall, currentTrend, forecastBasisWindow, confidence, consistency, forecastRatePerWeek, forecastStatus, divergenceNote };
  },

  // First window in `order` that has enough data, tagged with which window it is.
  pickWindow(windows, order){
    for(const d of order){ if(windows[d]) return { windowDays:d, ...windows[d] }; }
    return null;
  },

  // "Is there enough history to trust a projection" — purely count/span-based (same
  // thresholds as estimateCompletion()/computeCalibration()). Deliberately NOT based
  // on R²: a short, scattered dataset and a short, razor-straight one are equally
  // unproven, so statistical fit alone isn't the gate here. See trendConsistency()
  // below for the separate "how closely do the points track the line" read.
  trendConfidence(weightLogs, overall){
    if(weightLogs.length < MIN_COMPLETION_POINTS || !overall) return 'insufficient';
    const sorted = [...weightLogs].sort((a,b)=> new Date(a.date)-new Date(b.date));
    const spanDays = (new Date(sorted[sorted.length-1].date) - new Date(sorted[0].date))/86400000;
    if(spanDays < MIN_TREND_SPAN_DAYS) return 'insufficient';
    return spanDays >= MIN_GOAL_TRACKING_DAYS ? 'established' : 'emerging';
  },

  // 'steady' | 'variable' | null — a SEPARATE axis from trendConfidence() above: a
  // dataset can be "established" (plenty of history) and still "variable" (a lot of
  // day-to-day scatter around that history's trend), so the two aren't collapsed into
  // one score. Reuses the same overall-regression R² already computed by
  // computeTrend() rather than a second pass over the logs. Gated behind the same
  // count/span floor as trendConfidence() (an R² from 3 points isn't meaningful) PLUS
  // a logging-density floor, so a few scattered logs across a long gappy stretch
  // report null ("not enough regular logging to tell") instead of a falsely
  // confident reading either way — this is the "missing data" factor the plain R²
  // number alone wouldn't catch.
  trendConsistency(weightLogs, overall){
    if(weightLogs.length < MIN_COMPLETION_POINTS || !overall || overall.r2==null) return null;
    const sorted = [...weightLogs].sort((a,b)=> new Date(a.date)-new Date(b.date));
    const spanDays = (new Date(sorted[sorted.length-1].date) - new Date(sorted[0].date))/86400000;
    if(spanDays < MIN_TREND_SPAN_DAYS) return null;
    const logsPerWeek = weightLogs.length / ((spanDays/7) || 1);
    if(logsPerWeek < TREND_CONSISTENCY_MIN_LOGS_PER_WEEK) return null;
    return overall.r2 >= TREND_CONSISTENCY_R2_THRESHOLD ? 'steady' : 'variable';
  },

  // Always picks whichever of {forecast-basis window, full history} is SLOWER, in
  // either direction — never lets a short hot streak overpromise, and never lets a
  // stale historical average paper over a genuine recent slowdown. 'conflicting'
  // (enough data, but the two disagree on direction) is reported distinctly from
  // 'insufficient' (not enough data at all) since they need different copy.
  //
  // Conflict is checked against BOTH forecastBasisWindow and currentTrend, not just
  // forecastBasisWindow — found by running this against a synthetic "old regime
  // gaining, recent 10 days losing" dataset: forecastBasisWindow prefers the 30-day
  // window, which can still be mostly the OLD regime and so happen to agree with
  // `overall` by coincidence even while currentTrend (14-day) has already reversed.
  // Checking currentTrend too catches a real recent reversal that a stable-looking
  // longer window alone would miss.
  calculateForecastRate(forecastBasisWindow, overall, currentTrend, confidence){
    if(confidence==='insufficient' || !forecastBasisWindow || !overall){
      return { forecastRatePerWeek:null, forecastStatus:'insufficient' };
    }
    const basis = forecastBasisWindow.slopePerWeek, hist = overall.slopePerWeek;
    const recent = currentTrend ? currentTrend.slopePerWeek : basis;
    if(Math.sign(basis) !== Math.sign(hist) || Math.sign(recent) !== Math.sign(hist)){
      return { forecastRatePerWeek:null, forecastStatus:'conflicting' };
    }
    const mag = Math.min(Math.abs(basis), Math.abs(hist));
    return { forecastRatePerWeek: mag * Math.sign(hist), forecastStatus:'ok' };
  },

  divergenceNote(window7, currentTrend){
    if(!window7 || !currentTrend || currentTrend.windowDays===7) return null;
    if(Math.abs(window7.slopePerWeek - currentTrend.slopePerWeek) <= TREND_DIVERGENCE_THRESHOLD) return null;
    return `Your most recent week looks different from your ${currentTrend.windowDays}-day trend — a single unusual weigh-in can do this.`;
  },

  // Mirrors estimateCompletion()'s goal-date guard (isExtrapolationConfident) but
  // driven by the clamped forecastRatePerWeek instead of a raw single-window slope,
  // so there is exactly one "when will I hit my goal" figure app-wide. Callers are
  // expected to skip calling this for maintain goals (goalWeight===startWeight
  // makes "days to reach your maintain weight" meaningless) — see the goalType
  // guard already applied at each of this function's call sites.
  forecastGoal(profile, avgW, analysis){
    if(isGoalReached()) return { status:'reached' };
    if(analysis.forecastStatus==='insufficient') return { status:'insufficient' };
    if(analysis.forecastStatus==='conflicting') return { status:'conflicting' };
    const rate = analysis.forecastRatePerWeek;
    if(getGoalProgressDirection(rate, profile.goalType) !== 'toward') return { status:'stalled' };

    const dir = profile.goalWeight >= profile.startWeight ? 1 : -1;
    const goalDistance = Math.max(0, dir>0 ? (profile.goalWeight-avgW) : (avgW-profile.goalWeight));
    const goalDays = Math.round(goalDistance / (Math.abs(rate)/7));
    const sorted = [...state.weightLogs].sort((a,b)=> new Date(a.date)-new Date(b.date));
    const trackedDays = Math.round((new Date(sorted[sorted.length-1].date)-new Date(sorted[0].date))/86400000);
    const confident = isExtrapolationConfident(trackedDays, goalDays);
    const forecastDate = confident ? new Date(Date.now()+goalDays*86400000) : null;
    return { status:'ok', goalDays, forecastDate, confident, trackedDays };
  },

  // Pure, no state dependency — per the spec's suggested API. planRatePerWeek and
  // actualRatePerWeek must already be sign-normalized by the caller (positive =
  // progress toward goal, via normalizeToGoalProgress) so this never needs to know
  // loss/gain itself. Never returns a value that should trigger a calorie/
  // calibration change on its own — informational only.
  compareExpectedVsActual(planRatePerWeek, actualRatePerWeek){
    if(Math.abs(actualRatePerWeek) < TREND_NOISE_EPSILON*7) return { status:'plateaued' };
    if(actualRatePerWeek < 0) return { status:'reversing' };
    const withinTolerance = Math.abs(actualRatePerWeek - planRatePerWeek) <= Math.max(Math.abs(planRatePerWeek) * PROGRESS_CHECK_TOLERANCE_RATIO, PROGRESS_CHECK_TOLERANCE_FLOOR);
    if(withinTolerance) return { status:'on-pace' };
    return actualRatePerWeek > planRatePerWeek
      ? { status:'faster', diff: actualRatePerWeek-planRatePerWeek }
      : { status:'slower', diff: planRatePerWeek-actualRatePerWeek };
  },
};

// ---------------- weight trend & forecast: rendering ----------------
// Calculation lives entirely in WeightTrendEngine above; everything below just
// turns its output into markup, matching the app's existing calc/render split
// (e.g. estimateCompletion() / renderEstimatedTimeline()). Each function derives
// what it needs from state independently, same convention as the rest of the file.

function isStaleLastLog(sortedDescLogs){
  if(sortedDescLogs.length===0) return false;
  const last = sortedDescLogs[0].date;
  return last !== todayStr() && last !== dateKeyFor(new Date(Date.now()-86400000));
}

// Compact, cardless block for the always-visible dash-top tier (not the collapsed
// Insights disclosure) — covers "trend rate" and "forecast" from the mobile
// priority order without adding a second full card next to the milestone card
// (deliberately not reopening the existing Dashboard hierarchy pass).
function renderTrendStrip(){
  const p = state.profile;
  const goalType = p.goalType || 'loss';
  const n = state.weightLogs.length;
  if(n===0) return `<div class="helper">Start logging your weight to see your trend.</div>`;
  if(n < MIN_COMPLETION_POINTS) return `<div class="helper">Keep logging your weight to establish a trend.</div>`;

  const analysis = WeightTrendEngine.analyze();
  if(analysis.confidence==='insufficient' || !analysis.currentTrend){
    return `<div class="helper">Your trend will become more reliable after you've logged over a longer period.</div>`;
  }

  const { currentTrend } = analysis;
  const magnitude = Math.abs(currentTrend.slopePerWeek);
  const goingDown = currentTrend.slopePerWeek < -0.05, goingUp = currentTrend.slopePerWeek > 0.05;
  const direction = getGoalProgressDirection(currentTrend.slopePerWeek, goalType);
  const color = direction==='toward' ? 'var(--pine)' : direction==='away' ? 'var(--danger)' : 'var(--moss)';
  const arrowGlyph = goingDown ? '&#8595;' : goingUp ? '&#8593;' : '&#8594;';
  const rateText = (!goingDown && !goingUp) ? 'Roughly flat this stretch' : `Trending ${goingDown?'down':'up'}, about ${fmtWeight(magnitude)} ${weightUnitLabel()}/week`;

  const sortedDesc = [...state.weightLogs].sort((a,b)=> new Date(b.date)-new Date(a.date));
  const staleness = isStaleLastLog(sortedDesc) ? ` (as of ${prettyDate(sortedDesc[0].date)})` : '';

  let sentence;
  if(!goingDown && !goingUp) sentence = 'Your weight has been fairly steady lately.';
  else if(direction==='toward') sentence = 'Your weight is trending toward your goal.';
  else if(direction==='away') sentence = "Your weight is trending away from your goal right now — daily numbers bounce around, so we'll keep watching before flagging anything.";
  else sentence = 'Your weight is holding close to your maintenance target.';

  let teaser = '';
  if(goalType!=='maintain'){
    const forecast = WeightTrendEngine.forecastGoal(p, rollingAverageWeight(), analysis);
    if(forecast.status==='ok' && forecast.confident){
      teaser = ` Projected around ${prettyDateObj(forecast.forecastDate)}, using a conservative blend of your recent and longer-term trend.`;
    } else if(forecast.status==='conflicting' && direction!=='away'){
      // When direction is already 'away', the sentence above already communicates
      // "hold on, we're watching" — appending this would just repeat that in
      // different words rather than adding new information.
      teaser = " Your trend looks like it's shifting — we'll keep watching before projecting a date.";
    }
  }

  return `
    <div class="trend-label">
      <span class="trend-arrow" style="background:${color}22; color:${color};">${arrowGlyph}</span>
      <span style="color:${color};">${rateText}${staleness}</span>
    </div>
    <div class="helper">${sentence}${teaser}</div>
  `;
}

// Full 7/14/30-day breakdown + confidence, inside the Insights disclosure.
function renderWeightTrendCard(){
  const p = state.profile;
  const goalType = p.goalType || 'loss';
  const n = state.weightLogs.length;
  if(n===0) return `<div class="empty-state">Start logging your weight to see your trend.</div>`;
  if(n < MIN_COMPLETION_POINTS) return `<div class="empty-state">Keep logging your weight to establish a trend — a few more weigh-ins and this will fill in.</div>`;

  const analysis = WeightTrendEngine.analyze();
  const confidenceCopy = {
    insufficient: { badge:'badge-upcoming', text:'Insufficient data', note:"Your trend will become more reliable after you've logged over a longer period." },
    emerging: { badge:'badge-current', text:'Emerging trend', note:'Your trend is becoming clearer as you add more weigh-ins.' },
    established: { badge:'badge-reached', text:'Established trend', note:'Your current trend is based on enough data to provide a useful estimate.' },
  }[analysis.confidence];
  // A separate read from the confidence badge above: confidence is "how much history
  // do we have," consistency is "how closely do your actual weigh-ins track that
  // history's trend line" (R² of the overall regression). A dataset can be
  // established and still variable, or emerging and already quite steady.
  const consistencyCopy = {
    steady: { badge:'badge-reached', text:'Steady', note:'Your weigh-ins track your overall trend closely — day-to-day bounce is small relative to the trend itself.' },
    variable: { badge:'badge-current', text:'Variable', note:'Your weigh-ins bounce around your overall trend more than usual — the direction above is still your best estimate, just read it as a range rather than a precise number.' },
  }[analysis.consistency] || null;

  const windowCell = (days)=>{
    const win = analysis.windows[days];
    if(!win) return `<div><div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">${days}-day</div><div class="mono" style="color:var(--moss); font-size:12.5px; margin-top:4px;">Not enough data</div></div>`;
    const direction = getGoalProgressDirection(win.slopePerWeek, goalType);
    const cellColor = direction==='toward' ? 'var(--pine)' : direction==='away' ? 'var(--danger)' : 'var(--moss)';
    const arrow = win.slopePerWeek < -0.05 ? '&#8595;' : win.slopePerWeek > 0.05 ? '&#8593;' : '&#8594;';
    return `<div><div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">${days}-day</div><div class="mono" style="color:${cellColor}; font-weight:600; margin-top:4px;">${arrow} ${fmt(Math.abs(win.slopePerWeek))}</div></div>`;
  };

  return `
    <span class="badge ${confidenceCopy.badge}">${confidenceCopy.text}</span>
    ${consistencyCopy ? `<span class="badge ${consistencyCopy.badge}" style="margin-left:6px;">${consistencyCopy.text}</span>` : ''}
    <div class="trend-window-grid">${windowCell(7)}${windowCell(14)}${windowCell(30)}</div>
    <div class="helper" style="margin-top:10px;">${confidenceCopy.note}</div>
    ${consistencyCopy ? `<div class="helper" style="margin-top:4px;">${consistencyCopy.note}</div>` : ''}
    ${analysis.divergenceNote ? `<div class="helper">${analysis.divergenceNote}</div>` : ''}
    <div class="helper" style="margin-top:6px;">These are full-regression trends over each window — Weekly insight and Rolling weight average below use simpler week-over-week comparisons for a quicker gut-check, so the numbers won't always match exactly.</div>
  `;
}

// Sole home for "when will I reach my goal" — see renderEstimatedTimeline() earlier
// in the file, which now only covers the near-term next-phase date.
function renderGoalForecastCard(){
  const p = state.profile;
  const goalType = p.goalType || 'loss';
  if(goalType==='maintain' || isGoalReached()) return '';
  if(state.weightLogs.length < MIN_COMPLETION_POINTS) return '';

  const analysis = WeightTrendEngine.analyze();
  const avgW = rollingAverageWeight();
  const forecast = WeightTrendEngine.forecastGoal(p, avgW, analysis);
  const remaining = Math.abs(p.goalWeight - avgW);

  let body;
  if(forecast.status==='insufficient'){
    body = `<div class="helper">Keep logging to build a reliable forecast.</div>`;
  } else if(forecast.status==='conflicting'){
    body = `<div class="helper">Your trend looks like it's shifting — we'll wait for it to settle before estimating a date.</div>`;
  } else if(forecast.status==='stalled'){
    body = `<div class="helper">Your recent trend isn't moving toward your goal yet, so we can't estimate a date.</div>`;
  } else if(!forecast.confident){
    body = `<div class="helper">Too early to project this far out reliably — keep logging and this will sharpen up.</div>`;
  } else {
    body = `
      <div class="mono" style="font-weight:600; font-size:20px; margin-top:6px;">${prettyDateObj(forecast.forecastDate)}</div>
      <div class="helper" style="margin-top:2px;">Estimated using a conservative blend of your recent and longer-term trend — about ${forecast.goalDays} day${forecast.goalDays===1?'':'s'}.</div>
    `;
  }

  return `
    <div class="section-title">Goal forecast</div>
    <div class="card">
      <div class="row2">
        <div><div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">Goal</div><div class="mono" style="font-weight:600; margin-top:4px;">${fmtWeight(p.goalWeight,0)} ${weightUnitLabel()}</div></div>
        <div><div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">Remaining</div><div class="mono" style="font-weight:600; margin-top:4px;">${fmtWeight(remaining,1)} ${weightUnitLabel()}</div></div>
      </div>
      ${body}
      <div class="helper" style="margin-top:8px;">Projected, not promised — daily readings bounce around and this updates as you log more.</div>
    </div>
  `;
}

// Compares the calorie plan's implied weekly rate against the observed trend.
// Informational only — never suggests changing calories itself (that stays the
// job of the existing calibration/adaptive-phase engine, see computeCalibration()
// and computePhases()); respects the same calibration safeguards untouched.
function renderProgressCheckCard(){
  const p = state.profile;
  const goalType = p.goalType || 'loss';
  if(goalType==='maintain' || isGoalReached()) return '';
  if(state.weightLogs.length < MIN_COMPLETION_POINTS) return '';

  const analysis = WeightTrendEngine.analyze();
  if(analysis.confidence==='insufficient' || !analysis.currentTrend) return '';

  const phases = computePhases(p);
  const avgW = rollingAverageWeight();
  const active = getActivePhase(phases, avgW);
  const planRatePerWeek = taperedAdjustment(p, active.weightTarget) / CAL_PER_LB * 7;
  const actualRatePerWeek = normalizeToGoalProgress(analysis.currentTrend.slopePerWeek, goalType);
  const check = WeightTrendEngine.compareExpectedVsActual(planRatePerWeek, actualRatePerWeek);

  const verb = goalType==='gain' ? 'gaining' : 'losing';
  const statusCopy = {
    'on-pace': "You're right around your planned pace.",
    'faster': `You're currently ${verb} a bit faster than planned. We'll keep monitoring your trend before recommending a change.`,
    'slower': `Your recent progress has slowed a bit. We'll keep monitoring your trend before recommending a change.`,
    'plateaued': `Your weight hasn't moved much lately. That's normal short-term — keep logging and we'll watch the trend.`,
    'reversing': `Your recent trend has moved the other way. Daily numbers bounce around, so we'll keep watching before flagging anything.`,
  };

  return `
    <div class="section-title">Progress check</div>
    <div class="card">
      <div class="row2">
        <div><div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">Plan</div><div class="mono" style="font-weight:600; margin-top:4px;">${fmtWeight(planRatePerWeek)} ${weightUnitLabel()}/week</div></div>
        <div><div class="k" style="font-size:11px;color:var(--moss);text-transform:uppercase;">Actual trend</div><div class="mono" style="font-weight:600; margin-top:4px;">${fmtWeight(Math.abs(actualRatePerWeek))} ${weightUnitLabel()}/week</div></div>
      </div>
      <div class="helper" style="margin-top:10px;">${statusCopy[check.status]}</div>
      <div class="helper" style="margin-top:4px;">This is informational — we won't change your calorie target from this alone.</div>
    </div>
  `;
}

// Preserves the historical fact that an earlier goal was reached when the user
// changes their goal weight, so extending (or even retreating from) a goal never
// erases a milestone already hit. The only thing that matters is whether the OLD
// goal was reached — the new goal's direction is irrelevant (e.g. someone who hit
// 220 and then raises their goal back to 250 should still keep credit for 220).
function recordGoalMilestone(oldProfile, newGoalWeight){
  if(!oldProfile) return;
  if((oldProfile.goalType||'loss')==='maintain') return; // nothing meaningful to preserve
  if(newGoalWeight === oldProfile.goalWeight) return;     // goal unchanged (e.g. unrelated settings edit)
  if(!isGoalReached()) return;                            // reads state.profile — still the OLD profile here
  if(state.milestones.some(m=> m.weight===oldProfile.goalWeight)) return; // dedup (e.g. 280->220->280->220)
  state.milestones.push({ weight: oldProfile.goalWeight, reachedDate: todayStr() });
}

// A coarse, milestone-level view of the journey — start, past reached goals, "you
// are here," and the current goal — distinct from the fine-grained phase list
// below (every `interval` lbs), not a duplicate of it. reachedDate is realistically
// the date the goal was CHANGED, not necessarily the exact date first crossed
// (there's no historical point-in-time rolling average to compute that precisely)
// — so it's stored but deliberately not shown here, to avoid implying false
// precision about *when*.
function renderMilestoneBreadcrumb(){
  const p = state.profile;
  if(state.milestones.length===0) return '';
  const dir = p.goalWeight >= p.startWeight ? 1 : -1;
  const sortedMilestones = [...state.milestones].sort((a,b)=> dir>0 ? a.weight-b.weight : b.weight-a.weight);
  const avgW = rollingAverageWeight();
  const stops = [
    { label: `${fmtWeight(p.startWeight,0)} ${weightUnitLabel()}`, sub: 'Starting point', kind:'reached' },
    ...sortedMilestones.map(m=> ({ label: `${fmtWeight(m.weight,0)} ${weightUnitLabel()}`, sub: 'Reached', kind:'reached' })),
    { label: `${fmtWeight(avgW,0)} ${weightUnitLabel()}`, sub: 'You are here', kind:'current' },
    { label: `${fmtWeight(p.goalWeight,0)} ${weightUnitLabel()}`, sub: 'Current goal', kind:'upcoming' },
  ];
  return `
    <div class="section-title">Journey milestones</div>
    <div class="milestone-breadcrumb">
      ${stops.map(s=> `
        <div class="breadcrumb-stop">
          <div class="breadcrumb-dot ${s.kind==='reached'?'reached':s.kind==='current'?'current':''}"></div>
          <div class="breadcrumb-label"><strong>${s.label}</strong> ${s.sub}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ---------------- roadmap tab ----------------
function renderRoadmap(){
  const p = state.profile;
  const phases = computePhases(p);
  const dir = phaseDirection(phases);
  const avgW = rollingAverageWeight();
  const active = getActivePhase(phases, avgW);
  const calibration = hasBodyStats(p) ? computeCalibration() : null;
  const calibrationPaused = (p.calibrationMode||'auto')==='paused';
  const effectiveCalibrationFactor = getEffectiveCalibrationFactor(calibration);
  const notes = [];
  if(effectiveCalibrationFactor!==1) notes.push(`calorie targets below are calibrated ${effectiveCalibrationFactor>=1?'up':'down'} ${fmt(Math.abs((effectiveCalibrationFactor-1)*100),1)}% ${calibrationPaused?'(paused — held at this fixed adjustment)':'based on your logged results'}`);
  if(p.taperDeficit) notes.push(`${(p.goalType||'loss')==='gain'?'surplus':'deficit'} tapers by up to 40% over the final third of your journey`);
  const el = document.getElementById('view-roadmap');
  el.innerHTML = `
    <h1 class="page-title">Roadmap</h1>
    <p class="page-sub">${phases.length} phases from ${fmt(p.startWeight,0)} to ${fmtWeight(p.goalWeight,0)} ${weightUnitLabel()}, stepping every ${p.interval} lbs. Progress is based on your ${Math.min(state.weightLogs.length, ROLLING_WINDOW)}-log rolling average of ${fmtWeight(avgW)} ${weightUnitLabel()}.</p>
    ${notes.length ? `<div class="banner" style="margin-bottom:16px;">📐 <div>${notes.join('; ')}.</div></div>` : ''}
    ${renderMilestoneBreadcrumb()}
    <div class="stack">
      ${phases.map(ph=>{
        const reached = dir>0 ? avgW >= ph.weightTarget : avgW <= ph.weightTarget;
        const isActive = ph.id===active.id && !isGoalReached();
        const badge = isActive? '<span class="badge badge-current">Current</span>' : reached? '<span class="badge badge-reached">Reached</span>' : '<span class="badge badge-upcoming">Upcoming</span>';
        const dotColor = isActive? 'var(--gold)' : reached? 'var(--pine)' : 'var(--line)';
        const rowClass = isActive? 'phase-row phase-current' : reached? 'phase-row phase-completed' : 'phase-row phase-upcoming';
        const size = estimateSizeForWeight(ph.weightTarget, p.sex);
        return `<div class="${rowClass}">
          <div class="phase-left">
            <div class="phase-dot" style="background:${dotColor};"></div>
            <div>
              <div class="phase-target">${fmtWeight(ph.weightTarget,0)} ${weightUnitLabel()}</div>
              <div class="phase-cals">${ph.eating} cal/day · maintenance ${ph.maintenance}</div>
              <div class="phase-cals">~waist <span class="measure">${size.waist}</span> · ${size.shirt}</div>
            </div>
          </div>
          ${badge}
        </div>`;
      }).join('')}
    </div>
    <div class="helper" style="margin-top:12px;">${SIZE_ESTIMATE_DISCLAIMER}</div>
  `;
}

  renderMealRows('act-meals', activityDraftMeals, 'new');

  });

    const date = document.getElementById('act-date').value || todayStr();
    const weightVal = weightInputToLbs(parseFloat(document.getElementById('act-weight').value));
    const protein = parseFloat(document.getElementById('act-protein').value) || 0;
    const carbs = parseFloat(document.getElementById('act-carbs').value) || 0;
    const fat = parseFloat(document.getElementById('act-fat').value) || 0;
    const water = parseFloat(document.getElementById('act-water').value) || 0;
    const notes = document.getElementById('act-notes').value.trim();
    const meals = activityDraftMeals
      .filter(m=> parseFloat(m.calories)>0)

    const hasWeight = weightVal > 0;
    const hasMeals = meals.length > 0;
    const hasExercise = exercise.length > 0;
    if(!hasWeight && !hasMeals && !hasExercise){ showToast('Enter a weight, a calorie entry, or an exercise entry.'); return; }

    if(hasWeight){
      const existingSameDate = state.weightLogs.find(l=>l.date===date);
      const outlier = findWeightOutlier(weightVal, date, existingSameDate?.id);
      if(outlier && !confirm(`That's ${fmtWeight(outlier.diff,1)} ${weightUnitLabel()} from your last entry (${fmtWeight(outlier.mostRecent.weight)} ${weightUnitLabel()} on ${prettyDate(outlier.mostRecent.date)}). Save ${fmtWeight(weightVal)} ${weightUnitLabel()} anyway?`)){
        return;
      }
    }

    const phasesBefore = computePhases(state.profile);
    const activeBefore = getActivePhase(phasesBefore, rollingAverageWeight());
    const goalBefore = isGoalReached();

    if(hasWeight){
      state.weightLogs = state.weightLogs.filter(l=>l.date!==date);
      state.weightLogs.push({id:cryptoId(), date, weight:weightVal, notes});
    }
    if(hasMeals){
      state.nutritionLogs = state.nutritionLogs.filter(n=>n.date!==date);
      state.nutritionLogs.push({id:cryptoId(), date, meals, protein, carbs, fat, water});
    }
    if(hasExercise){
      state.exerciseLogs = state.exerciseLogs.filter(e=>e.date!==date);
      state.exerciseLogs.push({id:cryptoId(), date, activities:exercise});
    }
    await saveState();
    activityDraftMeals = [emptyMealRow()];
    activityDraftExercise = [];

    if(hasWeight){
      // Recomputed fresh — the entry just saved can itself shift the metabolic
      // calibration factor, which would otherwise make this toast's "updated to Y"
      // number stale vs. what the dashboard shows a moment later. See quickLogEntry().
      const phasesAfter = computePhases(state.profile);
      const activeAfter = getActivePhase(phasesAfter, rollingAverageWeight());
      const goalAfter = isGoalReached();
      if(goalAfter && !goalBefore){
        showToast(`🎉 Goal reached! You hit your target weight of ${fmtWeight(state.profile.goalWeight,0)} ${weightUnitLabel()}.`);
      } else if(activeAfter.id !== activeBefore.id){
        showToast(`🏁 Milestone reached! Calorie target updated from ${activeBefore.eating} to ${activeAfter.eating}.`);
      } else {
        showToast('Entry saved.');
      }
    } else {
      showToast('Entry saved.');
    }
    renderAll();
    goTab('dashboard');
  };

  if(editingActivityDate){
